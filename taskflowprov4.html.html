    <style>
        .sb-collapsed .sb-hide { display: none !important; }
        .sb-collapsed .sb-center { justify-content: center; }
        .sb-only { display: none; }
        .sb-collapsed .sb-dot { left: auto !important; right: 6px !important; top: 4px !important; width: 8px !important; height: 8px !important; }
        .sb-collapsed .sb-only { display: block; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Thin Scrollbar */
        .scrollbar-thin::-webkit-scrollbar { width: 3px; height: 3px; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(203,213,225,.5); border-radius: 10px; }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: rgba(148,163,184,.5); }

        /* Rich Text Editor Styles */
        .rich-text-area, .rich-text-content {
            white-space: pre-wrap;
            word-break: break-word;
        }
        .rich-text-area b, .rich-text-content b { font-weight: bold; }
        .rich-text-area i, .rich-text-content i { font-style: italic; }
        .rich-text-area u, .rich-text-content u { text-decoration: underline; }
        .rich-text-area strike, .rich-text-content strike { text-decoration: line-through; }

        .rich-text-area h3, .rich-text-content h3 { font-size: 1.125rem; font-weight: 600; margin-top: 0.5rem; margin-bottom: 0.5rem; }
        .rich-text-area a, .rich-text-content a { color: #2563eb; text-decoration: underline; cursor: pointer; }
        .rich-text-area a[data-nou], .rich-text-content a[data-nou] { text-decoration: none; }
        .rich-text-area a:hover, .rich-text-content a:hover { color: #1d4ed8; }
        .rich-text-area ul, .rich-text-content ul { list-style-type: disc; padding-left: 1.5rem; margin-top: 0.25rem; margin-bottom: 0.25rem; }
    </style>
</head>

        const AVATAR_BG_COLORS = [
            'from-blue-500 to-purple-500',
            'from-emerald-500 to-teal-500',
            'from-amber-500 to-orange-500',
            'from-pink-500 to-rose-500',
            'from-indigo-500 to-blue-600'
        ];

        // --- Utility UI Functions ---
        const ProgressBar = ({ progress }) => (
          <div className="w-full bg-gray-200 rounded-full h-1.5 mt-2 overflow-hidden">
            <div className="bg-blue-600 h-1.5 rounded-full transition-all duration-300 ease-out" style={{ width: `${progress}%` }}></div>
          </div>
        );

        const formatTaskDateDisplay = (dateObj) => {
          if (!dateObj || !dateObj.date) return null;
          const [yyyy, mm, dd] = dateObj.date.split('-');
          if (!yyyy || !mm || !dd) return null;
          const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
          const monthStr = monthNames[parseInt(mm, 10) - 1] || mm;
          let dateStr = `${monthStr} ${parseInt(dd, 10)}, ${yyyy}`;
          if (dateObj.includeTime && dateObj.time) {
            const [hhStr, minStr] = dateObj.time.split(':');
            let hh = parseInt(hhStr, 10);
            const ampm = hh >= 12 ? 'PM' : 'AM';
            hh = hh % 12 || 12;
            dateStr += ` · ${hh}:${minStr} ${ampm}`;
          }
          return dateStr;
        };

        const getStatusColorClass = (status) => {
          switch (status) {
            case 'In Progress': return 'bg-red-400';
            case 'Review': return 'bg-amber-400';
            case 'Done': return 'bg-emerald-400';
            case 'To Do': default: return 'bg-gray-300';
          }
        };

        const renderAvatar = (userObj, sizeClasses = "w-8 h-8 text-xs", showOnline = false) => {
            if (!userObj) return null;
            
            const widthClass = sizeClasses.split(' ').find(c => c.startsWith('w-')) || 'w-8';
            const heightClass = sizeClasses.split(' ').find(c => c.startsWith('h-')) || 'h-8';
            const otherClasses = sizeClasses.split(' ').filter(c => !c.startsWith('w-') && !c.startsWith('h-')).join(' ');

            return (
                <div className={`relative inline-flex flex-shrink-0 ${widthClass} ${heightClass}`}>
                    {userObj.avatarUrl ? (
                        <img src={userObj.avatarUrl} alt={userObj.name} className={`w-full h-full rounded-full object-cover shadow-sm border border-gray-100 ${otherClasses}`} />
                    ) : (
                        <div className={`w-full h-full rounded-full bg-gradient-to-tr ${userObj.avatarBg || AVATAR_BG_COLORS[0]} flex items-center justify-center text-white font-bold shadow-sm uppercase ${otherClasses}`}>
                            {userObj.name ? userObj.name.charAt(0) : (userObj.username ? userObj.username.charAt(0) : 'U')}
                        </div>
                    )}
                    {showOnline && userObj.isOnline && (
                        <span className="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-green-500 border-[1.5px] border-white rounded-full z-10"></span>
                    )}
                </div>
            );
        };

        // --- Per-account archive helpers ---
        // Admin archive is global (item.archived). Everyone else archives into a personal Storage (item.archivedFor = [userIds]).
        // A non-admin "Delete" in Storage only removes the item from their own view (item.removedFor = [userIds]).
        const hasId = (arr, id) => Array.isArray(arr) && arr.includes(id);
        // Members have no Archive / Storage: only the global (admin) archive hides things from them.
        // Admin sees everything archived by anyone in Storage; an editor only sees what they archived themselves.
        const canUseArchive = (user) => user.role === 'admin' || user.role === 'editor';
        // Admin's project view also reflects what editors archived; editors only hide their own archives.
        const isArchivedForUser = (item, user) => !!item.archived || (user.role === 'admin' ? ((item.archivedFor || []).length > 0 || (item.removedFor || []).length > 0) : (user.role !== 'member' && (hasId(item.archivedFor, user.id) || hasId(item.removedFor, user.id))));
        // Cascade: non-admins don't re-mark children that the admin already archived
        const markCascade = (item, user) => (item.archived && user.role !== 'admin') ? item : markArchived(item, user);
        const inUserStorage = (item, user) => {
            if (user.role === 'admin') return !!item.archived || (item.archivedFor || []).length > 0 || (item.removedFor || []).length > 0;
            if (user.role === 'editor') return hasId(item.archivedFor, user.id) && !hasId(item.removedFor, user.id);
            return false;
        };
        const archivedByLabel = (item, allUsers) => {
            const names = [];
            if (item.archived) names.push('Admin');
            Array.from(new Set([...(item.archivedFor || []), ...(item.removedFor || [])])).forEach(id => {
                const u = allUsers.find(x => x.id === id);
                names.push(u ? (u.name || u.username) : 'Unknown');
            });
            return Array.from(new Set(names)).join(', ');
        };
        const markArchived = (item, user) => user.role === 'admin' ? { ...item, archived: true } : { ...item, archivedFor: Array.from(new Set([...(item.archivedFor || []), user.id])) };
        // Admin restore clears every archive flag (including ones set by editors)
        const markRestored = (item, user) => user.role === 'admin' ? { ...item, archived: false, archivedFor: [], removedFor: [] } : { ...item, archivedFor: (item.archivedFor || []).filter(x => x !== user.id) };
        const markRemoved = (item, user) => ({ ...item, archivedFor: (item.archivedFor || []).filter(x => x !== user.id), removedFor: Array.from(new Set([...(item.removedFor || []), user.id])) });

        // --- Bulk Date Selector ---
        function BulkDateSelector({ onApply, onClear }) {
            const [date, setDate] = useState("");
            const [incTime, setIncTime] = useState(false);
            const [time, setTime] = useState("17:00");
            return (
                <div onClick={e => e.stopPropagation()}>
                    <input 
                        type="date" 
                        value={date}
                        onChange={e => setDate(e.target.value)}
                        className="w-full text-sm border-gray-300 rounded p-1.5 mb-2 focus:ring-1 focus:ring-blue-500"
                    />
                    <label className="flex items-center gap-2 text-xs font-medium text-gray-700 mb-2 cursor-pointer">
                        <input type="checkbox" checked={incTime} onChange={e=>setIncTime(e.target.checked)} className="rounded text-blue-600 focus:ring-blue-500" />
                        Include time
                    </label>
                    {incTime && (

            const toggleUnderline = (e) => {
                const anchors = anchorsInSelection();
                if (anchors.length === 0) { execCommand(e, 'underline'); return; }
                e.preventDefault();
                const removing = anchors.every(a => !a.hasAttribute('data-nou'));
                anchors.forEach(a => { if (removing) a.setAttribute('data-nou', '1'); else a.removeAttribute('data-nou'); });
                refocusAndEmit();
            };

            // Pressing Heading again -> back to normal text
            const toggleHeading = (e) => {
                e.preventDefault();
                const el = editorRef.current;
                if (closestInEditor(el, 'H3')) document.execCommand('formatBlock', false, 'DIV');
                else document.execCommand('formatBlock', false, 'H3');
                refocusAndEmit();
            };

            const openLink = (e) => {
                e.preventDefault();
                const sel = window.getSelection();
                if (sel && sel.rangeCount && editorRef.current.contains(sel.anchorNode)) {
                    savedRange.current = sel.getRangeAt(0).cloneRange();
                }
                const existing = closestInEditor(editorRef.current, 'A');
                setLinkExisting(!!existing);
                setLinkUrl(existing ? existing.getAttribute('href') : '');
                setLinkOpen(true);
            };

            const restoreRange = () => {
                editorRef.current.focus();
                const sel = window.getSelection();
                sel.removeAllRanges();
                if (savedRange.current) sel.addRange(savedRange.current);
            };

            const closeLink = () => { setLinkOpen(false); setLinkUrl(''); };

            const applyLink = () => {
                const url = normalizeUrl(linkUrl);
                if (!url) { closeLink(); return; }
                restoreRange();
                const sel = window.getSelection();
                const existing = closestInEditor(editorRef.current, 'A');
                if (existing && sel.isCollapsed) {
                    existing.setAttribute('href', url);
                } else if (sel.isCollapsed) {
                    document.execCommand('insertHTML', false, `<a href="${url.replace(/"/g, '&quot;')}" target="_blank" rel="noopener noreferrer">${url.replace(/</g, '&lt;')}</a>&nbsp;`);
                } else {
                    document.execCommand('createLink', false, url);
                }
                editorRef.current.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
                closeLink();
                emit();
            };

            const removeLink = () => {
                restoreRange();
                const existing = closestInEditor(editorRef.current, 'A');
                if (existing) {
                    const r = document.createRange(); r.selectNodeContents(existing);
                    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
                }
                document.execCommand('unlink', false, null);
                closeLink();
                emit();
            };

            const handleWrapBlur = (e) => {
                // Only collapse when focus leaves the whole box (toolbar + editor)
                if (wrapRef.current && e.relatedTarget && wrapRef.current.contains(e.relatedTarget)) return;
                setIsFocused(false);
                setMention(null);
                const el = editorRef.current;
                if (el) {
                    if (linkifyAll(el)) onChange(el.innerHTML);
                    if (onBlur) onBlur(el.innerHTML);
                }
            };

            const handleLinkClick = (e) => {
                const a = e.target.closest && e.target.closest('a');
                if (!a || !editorRef.current.contains(a)) return;
                if (e.altKey) return; // Alt+click: keep the caret inside the link so it can be edited
                e.preventDefault();
                window.open(a.href, '_blank', 'noopener,noreferrer');
            };
            const handleEditorMouseDown = (e) => {
                const a = e.target.closest && e.target.closest('a');
                if (a && !expanded) e.preventDefault(); // clicking a link must not enter edit mode while collapsed
            };

            const btn = (on) => `p-1 rounded w-7 h-7 flex items-center justify-center ${on ? 'bg-blue-100 text-blue-700' : 'text-gray-700 hover:bg-gray-200'}`;

            const containerClass = isComment
                ? `relative flex flex-col border ${expanded ? 'border-blue-500 ring-1 ring-blue-500' : 'border-gray-200'} rounded-xl bg-white shadow-sm overflow-hidden transition-all`
                : expanded
                    ? 'relative flex flex-col border border-blue-500 ring-1 ring-blue-500 rounded-xl bg-white shadow-sm overflow-hidden transition-all'
                    : 'relative flex flex-col';

            const editorClass = isComment
                ? `w-full ${expanded ? (minHeight || 'min-h-[90px]') : 'min-h-[44px]'} text-sm text-gray-700 px-3 ${expanded ? 'py-3' : 'py-3'} outline-none cursor-text rich-text-area`
                : `w-full ${expanded ? (minHeight || 'min-h-[120px]') + ' p-3' : 'min-h-[32px] p-0'} text-sm text-gray-700 outline-none cursor-text rich-text-area`;

            return (
                <div ref={wrapRef} className={containerClass} onBlur={handleWrapBlur}>
                    {mention && (
                        <div className="fixed z-[100] w-64 bg-white border border-gray-200 rounded-xl shadow-xl overflow-hidden py-1" style={mention.up ? { left: mention.x, bottom: mention.y } : { left: mention.x, top: mention.y }}>
                            {mention.list.map((u, i) => (
                                <button key={u.id} type="button" onMouseDown={(e) => { e.preventDefault(); insertMention(u); }} className={`w-full text-left px-3 py-2 flex flex-col ${i === mention.idx ? 'bg-blue-50' : 'hover:bg-gray-50'}`}>
                                    <span className="text-sm font-semibold text-gray-800 leading-tight">{u.name}</span>
                                    <span className="text-[11px] text-gray-400 leading-tight">{u.username}</span>
                                </button>
                            ))}
                        </div>
                    )}
                    <input
                        ref={fileRef}
                        type="file"
                        multiple={!isComment}
                        className="hidden"
                        onChange={(e) => {
                            const files = Array.from(e.target.files || []);
                            e.target.value = '';
                            setPicking(false);
                            if (files.length && onAttachFiles) onAttachFiles(files);
                        }}
                    />
                    {expanded && (
                        <div onMouseDown={(e) => { if (e.target === e.currentTarget) e.preventDefault(); }} className="flex items-center gap-1 p-2 border-b border-gray-100 bg-gray-50/50 flex-wrap">
                            <button type="button" tabIndex={-1} onMouseDown={(e) => execCommand(e, 'bold')} className={btn(active.bold) + ' font-bold'} title="Bold">B</button>
                            <button type="button" tabIndex={-1} onMouseDown={(e) => execCommand(e, 'italic')} className={btn(active.italic) + ' italic font-serif'} title="Italic">I</button>
                            <button type="button" tabIndex={-1} onMouseDown={toggleUnderline} className={btn(active.underline) + ' underline'} title="Underline">U</button>
                            <button type="button" tabIndex={-1} onMouseDown={(e) => execCommand(e, 'strikeThrough')} className={btn(active.strike) + ' line-through'} title="Strikethrough">S</button>
                            <div className="w-px h-4 bg-gray-300 mx-1"></div>
                            <button type="button" tabIndex={-1} onMouseDown={(e) => execCommand(e, 'insertUnorderedList')} className={btn(active.ul)} title="Bullet List">
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 6h16M4 12h16M4 18h16M8 6h.01M8 12h.01M8 18h.01"/></svg>
                            </button>
                            <button type="button" tabIndex={-1} onMouseDown={toggleHeading} className={btn(active.h) + ' font-bold text-sm'} title="Heading (click again for normal text)">H</button>
                            <button type="button" tabIndex={-1} onMouseDown={openLink} className={btn(active.link || linkOpen)} title="Insert link">
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244"/></svg>
                            </button>
                            <div className="w-px h-4 bg-gray-300 mx-1"></div>
                            <button type="button" tabIndex={-1} onMouseDown={(e) => e.preventDefault()} onClick={() => { setPicking(true); if (fileRef.current) fileRef.current.click(); }} className="p-1 hover:bg-gray-200 rounded text-gray-700 cursor-pointer w-7 h-7 flex items-center justify-center" title="Add attachment">
                                <Paperclip className="w-4 h-4" />
                            </button>
                        </div>
                    )}
                    {expanded && linkOpen && (
                        <div onMouseDown={(e) => { if (e.target === e.currentTarget) e.preventDefault(); }} className="flex items-center gap-2 px-2 py-2 border-b border-gray-100 bg-white">
                            <input
                                autoFocus
                                type="text"
                                value={linkUrl}
                                onChange={(e) => setLinkUrl(e.target.value)}
                                onKeyDown={(e) => {
                                    if (e.key === 'Enter') { e.preventDefault(); applyLink(); }
                                    if (e.key === 'Escape') { e.preventDefault(); closeLink(); restoreRange(); }
                                }}
                                placeholder="Paste a link, e.g. moew.com"
                                className="flex-1 min-w-0 text-sm border border-gray-300 rounded-md px-2 py-1 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                            />
                            <button type="button" onClick={applyLink} className="text-xs font-semibold bg-blue-600 text-white px-2.5 py-1.5 rounded-md hover:bg-blue-700">Apply</button>
                            {linkExisting && (
                                <button type="button" onClick={removeLink} className="text-xs font-semibold bg-red-50 text-red-600 px-2.5 py-1.5 rounded-md hover:bg-red-100">Remove link</button>
                            )}
                            <button type="button" onClick={() => { closeLink(); restoreRange(); }} className="text-xs text-gray-500 hover:text-gray-800 px-1.5">Cancel</button>
                        </div>
                    )}
                    <div
                        ref={editorRef}
                        contentEditable
                        suppressContentEditableWarning
                        className={editorClass + ' empty:before:content-[attr(data-placeholder)] empty:before:text-gray-400 empty:before:pointer-events-none empty:before:block'}
                        data-placeholder={placeholder}
                        onInput={handleInput}
                        onFocus={() => setIsFocused(true)}
                        onKeyDown={handleKeyDown}
                        onMouseDown={handleEditorMouseDown}
                        onClick={handleLinkClick}
                        onPaste={(e) => {
                            const files = filesFromClipboard(e.clipboardData);
                            if (files.length && onAttachFiles) { e.preventDefault(); onAttachFiles(files); }
                        }}
                        onDragOver={(e) => { if (onAttachFiles && e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) e.preventDefault(); }}
                        onDrop={(e) => {
                            const files = Array.from((e.dataTransfer && e.dataTransfer.files) || []);
                            if (files.length && onAttachFiles) { e.preventDefault(); onAttachFiles(files); }
                        }}
                    />
                </div>
            );
        }

        // --- Live drag & drop helpers ---
        // FLIP: when the order of items changes, every item slides from its old spot to its new one
        const useFlip = (key) => {
            const els = useRef(new Map());
            const prev = useRef(new Map());
            const flipRef = (id) => (el) => { if (el) els.current.set(id, el); else els.current.delete(id); };
            useLayoutEffect(() => {
                const cur = new Map();   // offset of an animation that is still running
                els.current.forEach((el, id) => {
                    if (el.style.transform) { try { const m = new DOMMatrix(getComputedStyle(el).transform); cur.set(id, { x: m.m41, y: m.m42 }); } catch (e) {} }
                });
                const next = new Map();
                els.current.forEach((el, id) => next.set(id, { p: el.offsetParent, x: el.offsetLeft, y: el.offsetTop }));
                els.current.forEach((el, id) => {
                    const a = prev.current.get(id), b = next.get(id);
                    if (a && b && a.p === b.p && (a.x !== b.x || a.y !== b.y)) {
                        // a task that changes column simply lands there (no sliding across the board)
                        if (id.startsWith('t:') && a.x !== b.x) { el.style.transition = 'none'; el.style.transform = ''; return; }
                        const c = cur.get(id) || { x: 0, y: 0 };
                        el.style.transition = 'none';
                        el.style.transform = `translate(${a.x + c.x - b.x}px, ${a.y + c.y - b.y}px)`;
                        void el.offsetHeight;
                        el.style.transition = 'transform 200ms cubic-bezier(.2,.8,.2,1)';
                        el.style.transform = '';
                    }
                });
                prev.current = next;
            }, [key]);
            return flipRef;
        };
        // Position of an element ignoring FLIP translations that are still animating (keeps hover tests stable)
        const layoutRect = (el) => {
            const r = el.getBoundingClientRect();
            let ty = 0;
            for (let n = el; n && n !== document.body; n = n.parentElement) {
                const tr = getComputedStyle(n).transform;
                if (tr && tr !== 'none') { try { ty += new DOMMatrix(tr).m42; } catch (e) {} }
            }
            return { top: r.top - ty, height: r.height };
        };
        // Move a group of ids next to targetId (before / after) inside an ordered id list
        const moveGroup = (order, ids, targetId, after) => {
            const set = new Set(ids);
            const group = order.filter(x => set.has(x));
            const rest = order.filter(x => !set.has(x));
            const pos = rest.indexOf(targetId);
            if (pos === -1) return order;
            rest.splice(after ? pos + 1 : pos, 0, ...group);
            return rest;
        };
        const sameOrder = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
        // Re-order only the items of `list` whose ids are in newOrder (other items keep their slots)
        const reorderSubset = (list, newOrder) => {
            const set = new Set(newOrder);
            const byId = new Map(list.map(x => [x.id, x]));
            const q = [...newOrder];
            return list.map(x => set.has(x.id) ? byId.get(q.shift()) : x);
        };

        // --- Main App Component ---
        function App({ appUser, setAppUser, globalData, handleLogout, useLocalMode, onLocalWrite }) {
            const [_users, _setUsers] = useState(globalData.users);
            const [_projects, _setProjects] = useState(globalData.projects);
            const [_sections, _setSections] = useState(globalData.sections);
            const [_tasks, _setTasks] = useState(globalData.tasks);
            const [_events, _setEvents] = useState(globalData.events || []);
            useEffect(() => _setEvents(globalData.events || []), [globalData.events]);

            useEffect(() => _setUsers(globalData.users), [globalData.users]);
            useEffect(() => _setProjects(globalData.projects), [globalData.projects]);
            useEffect(() => _setSections(globalData.sections), [globalData.sections]);
            useEffect(() => _setTasks(globalData.tasks), [globalData.tasks]);

            // small shared log (who deleted what) so other people can be told
            const logEvents = (evs) => {
                _setEvents(prev => {
                    const ids = new Set(prev.map(e => e.id));
                    const add = evs.filter(e => !ids.has(e.id));
                    if (!add.length) return prev;
                    const next = [...prev, ...add].slice(-300);
                    if (!useLocalMode && window.fb && window.fb.db) {
                        try { window.fb.setDoc(window.fb.doc(window.fb.db, 'artifacts', 'taskflow_pro_v1', 'public', 'data', 'events', 'all'), { list: next }); } catch (e) {}
                    }
                    if (useLocalMode) { try { localStorage.setItem('tf_events', JSON.stringify(next)); } catch (e) {} }
                    return next;
                });
            };

            const createSyncSetter = (colName, baseSetter) => (items) => {
                baseSetter(prev => {
                    let newItems = typeof items === 'function' ? items(prev) : items;
                    // remember who last changed a task / project (drives notifications)
                    if ((colName === 'tasks' || colName === 'projects' || colName === 'sections') && Array.isArray(newItems) && Array.isArray(prev)) {
                        const pm = new Map(prev.map(x => [x.id, x]));
                        newItems = newItems.map(x => {
                            const p = pm.get(x.id);
                            if (!p && colName === 'tasks' && !x.createdBy) return { ...x, createdBy: appUser.id, lastUpdatedBy: appUser.id };
                            if (p === x || x.lastUpdatedBy === appUser.id) return x;
                            if (p && JSON.stringify(p) === JSON.stringify(x)) return x;
                            return { ...x, lastUpdatedBy: appUser.id };
                        });
                    }
                    if ((colName === 'tasks' || colName === 'sections' || colName === 'projects') && Array.isArray(prev) && Array.isArray(newItems)) {
                        const nids = new Set(newItems.map(x => x.id));
                        const removed = prev.filter(x => !nids.has(x.id));
                        if (removed.length) {
                            const kind = colName === 'tasks' ? 'task' : colName === 'sections' ? 'section' : 'project';
                            const evs = removed.map(x => ({ id: `${kind}_${x.id}_del`, kind: kind + '-delete', itemId: x.id, title: x.title || x.name || '', projectId: kind === 'project' ? x.id : x.projectId, sectionId: x.sectionId || null, by: appUser.id, ts: Date.now() }));
                            queueMicrotask(() => logEvents(evs));
                        }
                    }
                    if (!useLocalMode && window.fb && window.fb.db) {
                        try {
                            const docRef = window.fb.doc(window.fb.db, 'artifacts', 'taskflow_pro_v1', 'public', 'data', colName, 'all');
                            window.fb.setDoc(docRef, { items: newItems });
                        } catch(e) { console.error("Firebase sync error:", e); }
                    }
                    if (useLocalMode) {
                        if (colName === 'users') localStorage.setItem('tf_app_users', JSON.stringify(newItems));
                        if (colName === 'projects') localStorage.setItem('tf_v4_projects', JSON.stringify(newItems));
                        if (colName === 'sections') localStorage.setItem('tf_v4_sections', JSON.stringify(newItems));
                        if (colName === 'tasks') localStorage.setItem('tf_v4_tasks', JSON.stringify(newItems));
                    }
                    if (onLocalWrite) queueMicrotask(() => onLocalWrite(colName, newItems));
                    return newItems;
                });
            };

            const setProjects = createSyncSetter('projects', _setProjects);
            const setSections = createSyncSetter('sections', _setSections);
            const setTasks = createSyncSetter('tasks', _setTasks);
            const setUsers = createSyncSetter('users', _setUsers);

            const users = _users;
            const projects = _projects;
            const sections = _sections;
            const tasks = _tasks;
            const events = _events;

            const [currentView, setCurrentView] = useState('mytasks'); 
            const [selectedProjectId, setSelectedProjectId] = useState(projects[0]?.id || null);
            const [taskModalOpen, setTaskModalOpen] = useState(false);
            const [selectedTaskId, setSelectedTaskId] = useState(null);

            const [newProjectName, setNewProjectName] = useState('');
            const [isAddingProject, setIsAddingProject] = useState(false);
            const [isAddingSection, setIsAddingSection] = useState(false);
            const [newSectionName, setNewSectionName] = useState('');

            const [contextMenu, setContextMenu] = useState(null);
            const [editingId, setEditingId] = useState(null);
            const [editValue, setEditValue] = useState("");

            const [shareModalOpen, setShareModalOpen] = useState(false);
            const [inviteSettingOpen, setInviteSettingOpen] = useState(false);
            const [notificationMsg, setNotificationMsg] = useState("");

            // Drag State Projects
            const [draggedProjectIndex, setDraggedProjectIndex] = useState(null);
            const [dragOverProjectIndex, setDragOverProjectIndex] = useState(null);
            const [dragProjectPosition, setDragProjectPosition] = useState('before');

            // Drag State Sections & Tasks
            const [draggedSectionIndex, setDraggedSectionIndex] = useState(null);
            const [dragOverSectionIndex, setDragOverSectionIndex] = useState(null);

            const [draggedTaskId, setDraggedTaskId] = useState(null);
            const [dragOverTaskId, setDragOverTaskId] = useState(null);
            const [dragTaskPosition, setDragTaskPosition] = useState('before');

            // Multi-Select States
            const [selectionBox, setSelectionBox] = useState(null);
            const [selectedTaskIds, setSelectedTaskIds] = useState(new Set());
            const [selectedSectionIds, setSelectedSectionIds] = useState(new Set());
            const [selectedArchiveKeys, setSelectedArchiveKeys] = useState(new Set());
            const suppressClearRef = useRef(false);
            const [selectedProjectIds, setSelectedProjectIds] = useState(new Set());
            const projAnchorRef = useRef(null);
            const hotkeyRef = useRef(null);
            const mouseRef = useRef({ x: 0, y: 0 });
            const sectionSelectRef = useRef(false);
            const dragActiveRef = useRef(false);
            const [sidebarCollapsed, setSidebarCollapsed] = useState(() => { try { return localStorage.getItem('tf_sidebar_collapsed') === '1'; } catch (e) { return false; } });
            const toggleSidebar = () => setSidebarCollapsed(v => { const n = !v; try { localStorage.setItem('tf_sidebar_collapsed', n ? '1' : '0'); } catch (e) {} return n; });
            const [armedSectionId, setArmedSectionId] = useState(null); // drag is only armed from a section title
            const [projDrag, setProjDrag] = useState(null);   // { ids, order }
            const [secDrag, setSecDrag] = useState(null);     // { ids, order }
            const [taskDrag, setTaskDrag] = useState(null);   // { id, sectionId, beforeId }

            useEffect(() => {
                const clearDrags = () => { setProjDrag(null); setSecDrag(null); setTaskDrag(null); };
                const onMove = (e) => {
                    mouseRef.current = { x: e.clientX, y: e.clientY };
                    // a drag whose source element was re-created never gets "dragend": clean up on the next plain mouse move
                    if (dragActiveRef.current && e.buttons === 0) clearDrags();
                };
                const disarm = () => setArmedSectionId(null);
                window.addEventListener('mouseup', disarm);
                window.addEventListener('mousemove', onMove);
                window.addEventListener('dragend', clearDrags);
                window.addEventListener('drop', clearDrags);
                return () => {
                    window.removeEventListener('mouseup', disarm);
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('dragend', clearDrags);
                    window.removeEventListener('drop', clearDrags);
                };
            }, []);
            const colsForWidth = (w) => (w >= 1024 ? 3 : w >= 768 ? 2 : 1);
            const [archCols, setArchCols] = useState(() => colsForWidth(window.innerWidth));
            const [archCollapsed, setArchCollapsed] = useState({ project: false, section: false, task: false });

            useEffect(() => {
                const onResize = () => setArchCols(colsForWidth(window.innerWidth));
                window.addEventListener('resize', onResize);
                return () => window.removeEventListener('resize', onResize);
            }, []);

            // Keyboard shortcuts (latest handler is kept in hotkeyRef)
            useEffect(() => {
                const onKey = (e) => { if (hotkeyRef.current) hotkeyRef.current(e); };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, []);

            // Click anywhere clears the multi-selection (Ctrl / Cmd / Shift keep it additive)
            useEffect(() => {
                const handleClick = (e) => {
                    setContextMenu(null);
                    if (e.ctrlKey || e.metaKey || e.shiftKey) return;
                    const t = e.target;
                    if (t && t.closest && (t.closest('[data-ctx-menu]') || t.closest('.arch-card'))) return;
                    if (sectionSelectRef.current) { sectionSelectRef.current = false; return; }
                    if (suppressClearRef.current) { suppressClearRef.current = false; return; }
                    setSelectedTaskIds(prev => prev.size ? new Set() : prev);
                    setSelectedSectionIds(prev => prev.size ? new Set() : prev);
                    setSelectedArchiveKeys(prev => prev.size ? new Set() : prev);
                    setSelectedProjectIds(prev => prev.size ? new Set() : prev);
                };
                window.addEventListener('click', handleClick);
                return () => window.removeEventListener('click', handleClick);
            }, []);

            const triggerToast = (msg) => {
                setNotificationMsg(msg);
                setTimeout(() => setNotificationMsg(""), 3500);
            };

            const currentProject = projects.find(p => p.id === selectedProjectId);
            
            // Permissions Definition
            const userMemberInProject = currentProject?.members?.find(m => m.email?.toLowerCase() === appUser.username?.toLowerCase());
            const isEditorOrAdmin = appUser.role === 'admin' || userMemberInProject?.role === 'editor';
            const isViewer = !isEditorOrAdmin;
            
            // Project Drag Allowed for everyone viewing the project list
            const canSortProject = true; 

            const visibleProjects = useMemo(() => {
                let projs = projects;
                if (appUser.role !== 'admin') {
                    projs = projects.filter(p => p.members?.some(m => m.email?.toLowerCase() === appUser.username?.toLowerCase()));
                }
                return projs.filter(p => !isArchivedForUser(p, appUser));
            }, [projects, appUser]);

            const archivedProjects = useMemo(() => {
                let projs = projects.filter(p => inUserStorage(p, appUser));
                if (appUser.role !== 'admin') {
                    projs = projs.filter(p => p.members?.some(m => m.email?.toLowerCase() === appUser.username?.toLowerCase()));
                }
                return projs;
            }, [projects, appUser]);

            useEffect(() => {
                if (visibleProjects.length > 0 && (!selectedProjectId || !visibleProjects.some(p => p.id === selectedProjectId))) {
                    setSelectedProjectId(visibleProjects[0].id);
                }
            }, [visibleProjects, selectedProjectId]);

            const calculateProgress = (taskList) => {
                if (!taskList || taskList.length === 0) return 0;
                const completed = taskList.filter(t => Boolean(t.completed)).length;
                return Math.round((completed / taskList.length) * 100);
            };

            const projectTasks = tasks.filter(t => t.projectId === selectedProjectId && !isArchivedForUser(t, appUser));
            const activeTask = tasks.find(t => t.id === selectedTaskId);
            const currentSections = sections.filter(s => s.projectId === selectedProjectId && !isArchivedForUser(s, appUser));

            // --- Multi-Select Marquee Logic ---
            const handleMainMouseDown = (e) => {
                if (currentView !== 'projects' && currentView !== 'mytasks' && currentView !== 'archived') return;
                if (e.target.closest('.arch-card') || e.target.closest('.task-card') || e.target.closest('.section-header h3') || e.target.closest('button') || e.target.closest('input') || e.target.closest('textarea') || e.target.closest('a') || e.button !== 0) return;
                e.preventDefault(); // no text highlighting while drag-selecting
                if (document.activeElement && document.activeElement !== document.body && document.activeElement.blur) document.activeElement.blur();
                setSelectionBox({ startX: e.clientX, startY: e.clientY, currentX: e.clientX, currentY: e.clientY });
                if (!e.shiftKey) {
                    setSelectedTaskIds(new Set());
                    setSelectedSectionIds(new Set());
                    setSelectedArchiveKeys(new Set());
                }
            };

            const handleMainMouseMove = (e) => {
                if (!selectionBox) return;
                setSelectionBox(prev => ({ ...prev, currentX: e.clientX, currentY: e.clientY }));
            };

            const handleMainMouseUp = (e) => {
                if (!selectionBox) return;
                const box = {
                    left: Math.min(selectionBox.startX, selectionBox.currentX),
                    right: Math.max(selectionBox.startX, selectionBox.currentX),
                    top: Math.min(selectionBox.startY, selectionBox.currentY),
                    bottom: Math.max(selectionBox.startY, selectionBox.currentY)
                };

                if (box.right - box.left > 5 || box.bottom - box.top > 5) {
                    const newTasks = new Set(selectedTaskIds);
                    const newSections = new Set(selectedSectionIds);
                    const newArch = new Set(selectedArchiveKeys);

                    document.querySelectorAll('[data-selection-id]').forEach(el => {
                        let rect = el.getBoundingClientRect();
                        if (el.dataset.type === 'section') {
                            const h = el.querySelector('.section-header');
                            if (h) rect = h.getBoundingClientRect();
                        }
                        const isIntersecting = rect.left < box.right && rect.right > box.left && rect.top < box.bottom && rect.bottom > box.top;
                        
                        if (isIntersecting) {
                            if (el.dataset.type === 'task') newTasks.add(el.dataset.selectionId);
                            if (el.dataset.type === 'section') newSections.add(el.dataset.selectionId);
                            if (el.dataset.type && el.dataset.type.startsWith('arch-')) newArch.add(el.dataset.selectionId);
                        }
                    });
                    setSelectedTaskIds(newTasks);
                    setSelectedSectionIds(newSections);
                    setSelectedArchiveKeys(newArch);
                    // the click that follows a drag-select must not clear the new selection
                    suppressClearRef.current = true;
                    setTimeout(() => { suppressClearRef.current = false; }, 60);
                }
                setSelectionBox(null);
            };

            // --- Shared helpers ---
            const canEditProj = (pid) => {
                if (appUser.role === 'admin') return true;
                const p = projects.find(x => x.id === pid);
                return !!p?.members?.some(m => m.email?.toLowerCase() === appUser.username?.toLowerCase() && m.role === 'editor');
            };
            const newId = (prefix) => prefix + '_' + Date.now() + Math.random().toString(36).slice(2, 7);
            const cleanCopy = (o) => ({ ...o, archived: false, archivedFor: [], removedFor: [] });
            // Put each copy right after its source item
            const insertAfterMap = (list, map) => {
                const out = [];
                list.forEach(it => { out.push(it); if (map[it.id]) out.push(...map[it.id]); });
                return out;
            };
            const deleteProjectsCascade = (idSet) => {
                setTasks(tasks.filter(t => !idSet.has(t.projectId)));
                setSections(sections.filter(x => !idSet.has(x.projectId)));
                setProjects(projects.filter(p => !idSet.has(p.id)));
            };
            const deleteSectionsCascade = (idSet) => {
                setTasks(tasks.filter(t => !idSet.has(t.sectionId)));
                setSections(sections.filter(x => !idSet.has(x.id)));
            };
            const duplicateMany = (taskIds, sectionIds, projectIds) => {
                const taskMap = {}, secMap = {}, projMap = {}, extraTasks = [], extraSecs = [];
                tasks.filter(t => taskIds.includes(t.id)).forEach(t => {
                    taskMap[t.id] = [{ ...cleanCopy(t), id: newId('t'), title: t.title + ' (Copy)' }];
                });
                sections.filter(x => sectionIds.includes(x.id)).forEach(x => {
                    const nId = newId('s');
                    secMap[x.id] = [{ ...cleanCopy(x), id: nId, name: x.name + ' (Copy)' }];
                    tasks.filter(t => t.sectionId === x.id && !isArchivedForUser(t, appUser)).forEach(t => {
                        extraTasks.push({ ...cleanCopy(t), id: newId('t'), sectionId: nId });
                    });
                });
                projectIds.forEach(pid => {
                    const p = projects.find(x => x.id === pid);
                    if (!p || !canEditProj(pid)) return;
                    const nId = newId('p');
                    projMap[pid] = [{ ...cleanCopy(p), id: nId, name: p.name + ' (Copy)' }];
                    sections.filter(sc => sc.projectId === pid && !isArchivedForUser(sc, appUser)).forEach(sc => {
                        const nsId = newId('s');
                        extraSecs.push({ ...cleanCopy(sc), id: nsId, projectId: nId });
                        tasks.filter(t => t.sectionId === sc.id && !isArchivedForUser(t, appUser)).forEach(t => {
                            extraTasks.push({ ...cleanCopy(t), id: newId('t'), projectId: nId, sectionId: nsId });
                        });
                    });
                });
                const total = Object.keys(taskMap).length + Object.keys(secMap).length + Object.keys(projMap).length;
                if (!total) return 0;
                if (Object.keys(taskMap).length || extraTasks.length) setTasks([...insertAfterMap(tasks, taskMap), ...extraTasks]);
                if (Object.keys(secMap).length || extraSecs.length) setSections([...insertAfterMap(sections, secMap), ...extraSecs]);
                if (Object.keys(projMap).length) setProjects(insertAfterMap(projects, projMap));
                return total;
            };
            const duplicateProjects = (ids) => duplicateMany([], [], ids);

            // --- Context Menu Actions ---
            const handleContextMenu = (e, type, id, currentName) => {
                e.preventDefault();
                e.stopPropagation();
                
                if (isViewer && type !== 'task' && type !== 'project') return;

                let actualType = type;
                let actualIds = [id];

                if (type === 'task' && selectedTaskIds.has(id) && selectedTaskIds.size > 1) {
                    actualType = 'bulk-task';
                    actualIds = Array.from(selectedTaskIds);
                } else if (type === 'section' && selectedSectionIds.has(id) && selectedSectionIds.size > 1) {
                    actualType = 'bulk-section';
                    actualIds = Array.from(selectedSectionIds);
                } else if (type === 'project' && selectedProjectIds.has(id) && selectedProjectIds.size > 1) {
                    actualType = 'bulk-project';
                    actualIds = Array.from(selectedProjectIds);
                } else {
                    if (type === 'task') setSelectedTaskIds(new Set([id]));
                    if (type === 'section') setSelectedSectionIds(new Set([id]));
                }

                let limited = false;
                if (type === 'project' && appUser.role !== 'admin') {
                    limited = !actualIds.every(pid => canEditProj(pid));
                }
                if (limited) return; // locked like a member: nothing to show
                setContextMenu({ x: e.clientX, y: e.clientY, type: actualType, ids: actualIds, id, currentName, limited });
            };

            const handleBulkAction = (actionType, additionalData) => {
                if (!contextMenu) return;
                const ids = contextMenu.ids || [contextMenu.id];
                
                if (actionType === 'delete') {
                    if (contextMenu.type.includes('task')) setTasks(tasks.filter(t => !ids.includes(t.id)));
                    else if (contextMenu.type.includes('section')) deleteSectionsCascade(new Set(ids));
                    else if (contextMenu.type.includes('project')) { deleteProjectsCascade(new Set(ids)); if (ids.includes(selectedProjectId)) setSelectedProjectId(null); }
                    triggerToast(`Deleted ${ids.length} items successfully.`);
                } else if (actionType === 'archive') {
                    if (!canUseArchive(appUser)) { setContextMenu(null); return; }
                    if (contextMenu.type.includes('task')) setTasks(tasks.map(t => ids.includes(t.id) ? markArchived(t, appUser) : t));
                    else if (contextMenu.type.includes('section')) { setSections(sections.map(s => ids.includes(s.id) ? markArchived(s, appUser) : s)); setTasks(tasks.map(t => ids.includes(t.sectionId) ? markCascade(t, appUser) : t)); }
                    else if (contextMenu.type.includes('project')) {
                        setProjects(projects.map(p => ids.includes(p.id) ? markArchived(p, appUser) : p));
                        setSections(sections.map(x => ids.includes(x.projectId) ? markCascade(x, appUser) : x));
                        setTasks(tasks.map(t => ids.includes(t.projectId) ? markCascade(t, appUser) : t));
                        if (ids.includes(selectedProjectId)) setSelectedProjectId(null);
                    }
                    triggerToast(`Archived ${ids.length} items.`);
                } else if (actionType === 'complete') {
                    setTasks(tasks.map(t => ids.includes(t.id) ? {...t, completed: true, status: 'Done'} : t));
                    triggerToast(`Marked ${ids.length} items as complete.`);
                } else if (actionType === 'status') {
                    setTasks(tasks.map(t => ids.includes(t.id) ? {...t, status: additionalData, completed: additionalData === 'Done'} : t));
                    triggerToast(`Status updated for ${ids.length} items.`);
                } else if (actionType === 'assignee') {
                    setTasks(tasks.map(t => ids.includes(t.id) ? {...t, assignee: additionalData?.username || '', assigneeId: additionalData?.id || ''} : t));
                    triggerToast(`Assigned ${ids.length} items.`);
                } else if (actionType === 'duedate') {
                    setTasks(tasks.map(t => ids.includes(t.id) ? {...t, endDateObj: additionalData} : t));
                    triggerToast(`Due date set for ${ids.length} items.`);
                } else if (actionType === 'duplicate') {
                    if (contextMenu.type.includes('task')) duplicateMany(ids, [], []);
                    else if (contextMenu.type.includes('section')) duplicateMany([], ids, []);
                    else if (contextMenu.type.includes('project')) duplicateMany([], [], ids);
                    triggerToast(`Duplicated ${ids.length} items.`);
                }
                
                setSelectedTaskIds(new Set());
                setSelectedSectionIds(new Set());
                setSelectedProjectIds(new Set());
                setContextMenu(null);
            };

            const startRename = () => {
                if (!contextMenu || isViewer) return;
                setEditingId(contextMenu.id);
                setEditValue(contextMenu.currentName);
                setContextMenu(null);
            };

            // ----- notifications (stored per account in this browser; changes by other people are detected by diffing) -----
            const notifKey = `tf_notif_${appUser.id}`;
            const [notifs, setNotifs] = useState(() => { try { const st = JSON.parse(localStorage.getItem(notifKey) || 'null'); return (st && st.items) || []; } catch (e) { return []; } });
            const notifSnapRef = useRef(null);
            const persistNotifs = (items) => { try { localStorage.setItem(notifKey, JSON.stringify({ items, snap: notifSnapRef.current })); } catch (e) {} };
            const [notifTick, setNotifTick] = useState(0);
            useEffect(() => {
                let store = null;
                try { store = JSON.parse(localStorage.getItem(notifKey) || 'null'); } catch (e) {}
                const prevSnap = store && store.snap;
                const nameOf = (id) => { const u = users.find(x => x.id === id); return u ? (u.name || u.username) : null; };
                const myName = (appUser.username || '').toLowerCase();
                const mine = (t) => t.assigneeId === appUser.id || (t.assignee || '').toLowerCase() === myName;
                const snap = { tasks: {}, projects: {}, sections: {}, secProj: {}, projNames: {}, projArch: {}, secArch: {}, pending: [] };
                const fresh = [];
                const now = Date.now();
                const mk = (o) => fresh.push({ id: 'n_' + now + '_' + fresh.length + Math.random().toString(36).slice(2, 5), read: false, ts: now, ...o });
                const archOf = (x) => !!x.archived || (x.archivedFor || []).length > 0;
                // who hears about a task: admins, members of the shared project, its creator, its commenters and its assignee
                const isAdminMe = appUser.role === 'admin';
                const myProjIds = new Set(projects.filter(p => isAdminMe || (p.members || []).some(m => (m.email || '').toLowerCase() === myName)).map(p => p.id));
                const relevant = (t) => myProjIds.has(t.projectId) || mine(t) || t.createdBy === appUser.id || (t.comments || []).some(c => c.author === appUser.name);

                // ---- archive / restore of projects and sections ----
                const projArchChanged = new Set(), secArchChanged = new Set();
                projects.forEach(p => {
                    if (!myProjIds.has(p.id)) return;
                    const a = archOf(p);
                    snap.projArch[p.id] = a;
                    if (prevSnap && prevSnap.projArch && p.id in prevSnap.projArch && prevSnap.projArch[p.id] !== a) {
                        projArchChanged.add(p.id);
                        if (p.lastUpdatedBy && p.lastUpdatedBy !== appUser.id) mk({ type: 'archive', kind: 'project', archived: a, scope: 'general', projectId: p.id, title: p.name, by: nameOf(p.lastUpdatedBy) });
                    }
                });
                sections.forEach(sc => {
                    if (!myProjIds.has(sc.projectId)) return;
                    const a = archOf(sc);
                    snap.secArch[sc.id] = a;
                    if (prevSnap && prevSnap.secArch && sc.id in prevSnap.secArch && prevSnap.secArch[sc.id] !== a) {
                        secArchChanged.add(sc.id);
                        if (!projArchChanged.has(sc.projectId) && sc.lastUpdatedBy && sc.lastUpdatedBy !== appUser.id) mk({ type: 'archive', kind: 'section', archived: a, scope: 'general', projectId: sc.projectId, title: sc.name, by: nameOf(sc.lastUpdatedBy) });
                    }
                });

                // ---- tasks ----
                tasks.forEach(t => {
                    if (!relevant(t)) return;
                    const fp = taskFingerprint(t);
                    fp.mine = mine(t);
                    snap.tasks[t.id] = fp;
                    if (!prevSnap) return;
                    const prev = prevSnap.tasks[t.id];
                    const byId = t.lastUpdatedBy && t.lastUpdatedBy !== appUser.id ? t.lastUpdatedBy : null;
                    const by = byId ? nameOf(byId) : null;
                    const iCommented = (t.comments || []).some(c => c.author === appUser.name);
                    const personalTask = mine(t) || iCommented || !!(prev && prev.mine);
                    if (!prev) { if (byId && (mine(t) || (prevSnap.rel && prevSnap.rel.includes(t.projectId)))) mk({ type: mine(t) ? 'assign' : 'create', scope: mine(t) ? 'personal' : 'general', taskId: t.id, projectId: t.projectId, title: t.title, by }); return; }
                    if (fp.comments > prev.comments) {
                        const before = (t.comments || []).slice(0, prev.comments);
                        const takenPart = mine(t) || before.some(c => c.author === appUser.name);
                        (t.comments || []).slice(prev.comments).filter(c => c.author !== appUser.name).forEach(c => {
                            const txt = stripHtmlText(c.text);
                            const low = txt.toLowerCase();
                            const mentioned = (!!appUser.name && low.includes('@' + appUser.name.toLowerCase())) || (!!myName && low.includes('@' + myName));
                            mk({ type: mentioned ? 'mention' : 'comment', scope: (mentioned || takenPart) ? 'personal' : 'general', taskId: t.id, projectId: t.projectId, title: t.title, by: c.author, text: txt.slice(0, 80) });
                        });
                    }
                    if (!byId) return;   // only changes that were really made by someone else
                    if (typeof prev.subs === 'string' || !Array.isArray(prev.subs)) prev.subs = fp.subs;   // old snapshot format
                    // assigned to / taken off a task
                    const d = [];
                    if (typeof prev.assignee === 'string' && fp.assignee !== prev.assignee) {
                        if (fp.mine && !prev.mine) mk({ type: 'assign', scope: 'personal', taskId: t.id, projectId: t.projectId, title: t.title, by });
                        else if (prev.mine && !fp.mine) mk({ type: 'unassign', scope: 'personal', taskId: t.id, projectId: t.projectId, title: t.title, by });
                        else d.push(`Assignee: ${prev.assignee || 'none'} → ${fp.assignee || 'none'}`);
                    }
                    if (typeof prev.arch === 'boolean' && fp.arch !== prev.arch && !projArchChanged.has(t.projectId) && !secArchChanged.has(t.sectionId)) {
                        mk({ type: 'archive', kind: 'task', archived: fp.arch, scope: personalTask ? 'personal' : 'general', taskId: t.id, projectId: t.projectId, title: t.title, by });
                    }
                    if (fp.title !== prev.title) d.push(`Title: "${prev.title}" → "${fp.title}"`);
                    if (typeof prev.due === 'string' && !prev.due.startsWith('{') && fp.due !== prev.due) d.push(`Due date: ${prev.due || 'none'} → ${fp.due || 'none'}`);
                    if (prev.status !== undefined && fp.status !== prev.status) d.push(`Status: ${prev.status || 'none'} → ${fp.status || 'none'}`);
                    d.push(...diffSubtasks(prev.subs, fp.subs));
                    if (fp.desc !== prev.desc) d.push('Description edited');
                    if (fp.atts > prev.atts) d.push(`${fp.atts - prev.atts} attachment${fp.atts - prev.atts > 1 ? 's' : ''} added`);
                    else if (fp.atts < prev.atts) d.push(`${prev.atts - fp.atts} attachment${prev.atts - fp.atts > 1 ? 's' : ''} removed`);
                    if (d.length) mk({ type: 'update', scope: personalTask ? 'personal' : 'general', taskId: t.id, projectId: t.projectId, title: t.title, by, details: d });
                });

                // ---- sections / project names ----
                sections.forEach(sc => {
                    if (!myProjIds.has(sc.projectId)) return;
                    snap.sections[sc.id] = sc.name;
                    snap.secProj[sc.id] = sc.projectId;
                    if (!prevSnap || !prevSnap.sections || !sc.lastUpdatedBy || sc.lastUpdatedBy === appUser.id) return;
                    const by = nameOf(sc.lastUpdatedBy);
                    const pn = (projects.find(p => p.id === sc.projectId) || {}).name;
                    if (!(sc.id in prevSnap.sections)) { if (prevSnap.rel && prevSnap.rel.includes(sc.projectId)) mk({ type: 'section-create', scope: 'general', projectId: sc.projectId, title: sc.name, projectName: pn, by }); }
                    else if (prevSnap.sections[sc.id] !== sc.name) mk({ type: 'section-rename', scope: 'general', projectId: sc.projectId, title: sc.name, from: prevSnap.sections[sc.id], projectName: pn, by });
                });
                projects.forEach(p => {
                    if (!myProjIds.has(p.id)) return;
                    snap.projNames[p.id] = p.name;
                    if (prevSnap && prevSnap.projNames && p.lastUpdatedBy && p.lastUpdatedBy !== appUser.id && prevSnap.projNames[p.id] && prevSnap.projNames[p.id] !== p.name) {
                        mk({ type: 'project-rename', scope: 'general', projectId: p.id, title: p.name, from: prevSnap.projNames[p.id], by: nameOf(p.lastUpdatedBy) });
                    }
                });
                projects.forEach(p => {
                    const m = (p.members || []).find(x => (x.email || '').toLowerCase() === myName);
                    if (!m) return;
                    snap.projects[p.id] = m.role;
                    if (!prevSnap || p.lastUpdatedBy === appUser.id) return;
                    const by = p.lastUpdatedBy ? nameOf(p.lastUpdatedBy) : null;
                    if (!(p.id in prevSnap.projects)) mk({ type: 'share', scope: 'personal', projectId: p.id, title: p.name, role: m.role, by });
                    else if (prevSnap.projects[p.id] !== m.role) mk({ type: 'role', scope: 'personal', projectId: p.id, title: p.name, role: m.role, from: prevSnap.projects[p.id], by });
                });
                if (prevSnap) {
                    Object.keys(prevSnap.projects).forEach(id => {
                        const p = projects.find(x => x.id === id);
                        if (p && !(id in snap.projects) && p.lastUpdatedBy && p.lastUpdatedBy !== appUser.id) mk({ type: 'removed', scope: 'personal', projectId: id, title: p.name, by: nameOf(p.lastUpdatedBy) });
                    });
                }

                // ---- deletions (the person who deleted comes from the shared event log) ----
                const pending = ((prevSnap && prevSnap.pending) || []).filter(x => now - x.ts < 30000);
                if (prevSnap) {
                    const taskIds = new Set(tasks.map(t => t.id)), secIds = new Set(sections.map(x => x.id)), projIds = new Set(projects.map(p => p.id));
                    const has = (kind, id) => pending.some(x => x.kind === kind && x.id === id);
                    Object.keys(prevSnap.tasks).forEach(id => { if (!taskIds.has(id) && !has('task', id)) { const p = prevSnap.tasks[id]; pending.push({ kind: 'task', id, title: p.title, projectId: p.pid, sectionId: p.sec, mine: !!p.mine, ts: now }); } });
                    Object.keys(prevSnap.sections || {}).forEach(id => { if (!secIds.has(id) && !has('section', id)) pending.push({ kind: 'section', id, title: prevSnap.sections[id], projectId: (prevSnap.secProj || {})[id], ts: now }); });
                    Object.keys(prevSnap.projNames || {}).forEach(id => { if (!projIds.has(id) && !has('project', id)) pending.push({ kind: 'project', id, title: prevSnap.projNames[id], projectId: id, ts: now }); });
                }
                const keep = [];
                pending.forEach(pd => {
                    if (now - pd.ts < 3000) { keep.push(pd); return; }          // let the event log catch up
                    const ev = events.find(e => e.kind === pd.kind + '-delete' && e.itemId === pd.id);
                    if (!ev) { if (now - pd.ts < 20000) keep.push(pd); return; }
                    if (ev.by === appUser.id) return;
                    // children of a deleted section / project are not announced one by one
                    if (pd.kind === 'task' && events.some(e => (e.kind === 'section-delete' && e.itemId === pd.sectionId) || (e.kind === 'project-delete' && e.itemId === pd.projectId))) return;
                    if (pd.kind === 'section' && events.some(e => e.kind === 'project-delete' && e.itemId === pd.projectId)) return;
                    mk({ type: 'delete', kind: pd.kind, scope: (pd.kind === 'task' && pd.mine) ? 'personal' : 'general', projectId: pd.projectId, title: pd.title, by: nameOf(ev.by) });
                });
                snap.pending = keep;

                snap.rel = Array.from(myProjIds);
                const me = users.find(x => x.id === appUser.id);
                snap.accountRole = me ? me.role : (prevSnap && prevSnap.accountRole);
                if (prevSnap && prevSnap.accountRole && snap.accountRole && prevSnap.accountRole !== snap.accountRole) {
                    mk({ type: 'account-role', scope: 'personal', title: snap.accountRole, role: snap.accountRole, from: prevSnap.accountRole, by: 'Admin' });
                }
                notifSnapRef.current = snap;
                const items = fresh.length ? [...fresh.reverse(), ...((store && store.items) || [])].slice(0, 100) : ((store && store.items) || []);
                try { localStorage.setItem(notifKey, JSON.stringify({ items, snap })); } catch (e) {}
                if (fresh.length) setNotifs(items);
                let timer = null;
                if (keep.length) timer = setTimeout(() => setNotifTick(n => n + 1), 3200);
                return () => { if (timer) clearTimeout(timer); };
            }, [tasks, projects, sections, users, events, notifTick]);
            const markAllNotifsRead = () => setNotifs(prev => { if (!prev.some(n => !n.read)) return prev; const next = prev.map(n => ({ ...n, read: true })); persistNotifs(next); return next; });
            const clearNotifs = () => { setNotifs([]); persistNotifs([]); };
            const openNotif = (n) => {
                setNotifs(prev => { const next = prev.map(x => x.id === n.id ? { ...x, read: true } : x); persistNotifs(next); return next; });
                if (n.type === 'account-role') return;
                if (!n.taskId) {
                    if (projects.some(p => p.id === n.projectId)) { setSelectedProjectId(n.projectId); setCurrentView('projects'); }
                } else if (tasks.some(t => t.id === n.taskId)) {
                    setSelectedTaskId(n.taskId); setTaskModalOpen(true);
                }
            };
            useEffect(() => {
                if (currentView === 'projects' && selectedProjectId && !visibleProjects.some(p => p.id === selectedProjectId)) {
                    setCurrentView('mytasks');
                    setSelectedProjectId(null);
                    setTaskModalOpen(false);
                }
            }, [visibleProjects, currentView, selectedProjectId]);
            const unreadTaskIds = useMemo(() => new Set(notifs.filter(n => !n.read && n.taskId).map(n => n.taskId)), [notifs]);
            const unreadProjectIds = useMemo(() => new Set(notifs.filter(n => !n.read && n.projectId).map(n => n.projectId)), [notifs]);
            const myListUnread = tasks.some(t => unreadTaskIds.has(t.id) && (t.assigneeId === appUser.id || (t.assignee || '').toLowerCase() === (appUser.username || '').toLowerCase()));
            const markReadWhere = (pred) => setNotifs(prev => {
                if (!prev.some(n => !n.read && pred(n))) return prev;
                const next = prev.map(n => (!n.read && pred(n)) ? { ...n, read: true } : n);
                persistNotifs(next);
                return next;
            });
            // opening a task / project = having seen its changes
            useEffect(() => { if (taskModalOpen && selectedTaskId) markReadWhere(n => n.taskId === selectedTaskId); }, [taskModalOpen, selectedTaskId, notifs]);
            useEffect(() => { if (currentView === 'projects' && selectedProjectId) markReadWhere(n => !n.taskId && (n.type === 'share' || n.type === 'role') && n.projectId === selectedProjectId); }, [currentView, selectedProjectId, notifs]);
            const bellEl = <NotificationBell items={notifs} onOpenItem={openNotif} onMarkAllRead={markAllNotifsRead} onClear={clearNotifs} />;

            const submitRename = (type, id) => {
                if (!editValue.trim() || isViewer) {
                    setEditingId(null);
                    return;
                }
                if (type === 'project') setProjects(projects.map(p => p.id === id ? { ...p, name: editValue.trim() } : p));
                else setSections(sections.map(s => s.id === id ? { ...s, name: editValue.trim() } : s));
                setEditingId(null);
            };

            const handleDeleteContextItem = () => {
                if (!contextMenu) return;
                if (contextMenu.type === 'project' && !contextMenu.limited) {
                    deleteProjectsCascade(new Set([contextMenu.id]));
                    if (selectedProjectId === contextMenu.id) setSelectedProjectId(null);
                    triggerToast("Project deleted.");
                }
                setContextMenu(null);
            };

            const handleArchiveProject = () => {
                if (!contextMenu || !canUseArchive(appUser)) return;
                if (contextMenu.type === 'project') {
                    setProjects(projects.map(p => p.id === contextMenu.id ? markArchived(p, appUser) : p));
                    setSections(sections.map(x => x.projectId === contextMenu.id ? markCascade(x, appUser) : x));
                    setTasks(tasks.map(t => t.projectId === contextMenu.id ? markCascade(t, appUser) : t));
                    if (selectedProjectId === contextMenu.id) setSelectedProjectId(null);
                    triggerToast("Project archived.");
                }
                setContextMenu(null);
            };
            
            const handleDuplicateProject = () => {
                if (!contextMenu || contextMenu.limited) return;
                if (contextMenu.type === 'project') {
                    if (duplicateProjects([contextMenu.id])) triggerToast("Project duplicated.");
                }
                setContextMenu(null);
            };

            const handleAddProject = (e) => {
                e.preventDefault();
                if (!newProjectName.trim() || (appUser.role !== 'admin' && appUser.role !== 'editor')) return;
                const newId = 'p_' + Date.now();
                const newP = { id: newId, name: newProjectName.trim(), members: appUser.role === 'admin' ? [] : [{ email: appUser.username, role: 'editor' }] };
                const defaultSecs = [
                    { id: 's1_' + Date.now(), projectId: newId, name: 'To Do' },
                    { id: 's2_' + Date.now(), projectId: newId, name: 'In Progress' },
                    { id: 's3_' + Date.now(), projectId: newId, name: 'Done' }
                ];
                setProjects([...projects, newP]);
                setSections([...sections, ...defaultSecs]);
                setSelectedProjectId(newId);
                setNewProjectName('');
                setIsAddingProject(false);
                setCurrentView('projects');
                triggerToast("Project created instantly!");
            };

            const handleAddSection = (e) => {
                e.preventDefault();
                if (!newSectionName.trim() || isViewer || !selectedProjectId) return;
                const newSec = { id: 's_' + Date.now(), projectId: selectedProjectId, name: newSectionName.trim() };
                setSections([...sections, newSec]);
                setNewSectionName('');
                setIsAddingSection(false);
            };

            const handleAddTask = (sectionId) => {
                if (isViewer || !selectedProjectId) return;
                const newTask = {
                    id: 't_' + Date.now(),
                    projectId: selectedProjectId,
                    sectionId,
                    title: "New Task",
                    description: "",
                    assignee: "",
                    endDateObj: { date: "", includeTime: false, time: "17:00" },
                    status: "To Do",
                    completed: false,
                    subtasks: [],
                    comments: [],
                    attachments: []
                };
                setTasks([...tasks, newTask]);
            };

            const handleUpdateTask = (taskId, updates) => {
                setTasks(prev => prev.map(t => {
                    if (t.id === taskId) {
                        const updated = { ...t, ...updates };
                        if ('completed' in updates) {
                            if (updates.completed) {
                                updated.status = "Done";
                            } else {
                                if (updated.status === "Done") updated.status = "In Progress";
                            }
                        } else if ('status' in updates) {
                            if (updates.status === "Done") {
                                updated.completed = true;
                            } else {
                                updated.completed = false;
                            }
                        }
                        return updated;
                    }
                    return t;
                }));
            };

            // ---- Tasks ----
            const displayTasksFor = (sectionId) => {
                const dIds = taskDrag ? taskDrag.ids : [];
                const base = projectTasks.filter(t => t.sectionId === sectionId && !dIds.includes(t.id));
                if (taskDrag && taskDrag.sectionId === sectionId) {
                    const moved = tasks.filter(t => dIds.includes(t.id));
                    if (moved.length) {
                        let idx = taskDrag.beforeId ? base.findIndex(t => t.id === taskDrag.beforeId) : -1;
                        if (idx === -1) idx = base.length;
                        base.splice(idx, 0, ...moved);
                    }
                }
                return base;
            };
            const handleTaskDragStart = (e, task) => {
                if (isViewer) { e.preventDefault(); return; }
                e.stopPropagation();
                e.dataTransfer.effectAllowed = 'move';
                try { e.dataTransfer.setData('text/plain', task.id); } catch (err) {}
                // dragging one of several selected tasks moves the whole selection
                const ids = (selectedTaskIds.has(task.id) && selectedTaskIds.size > 1)
                    ? tasks.filter(t => selectedTaskIds.has(t.id) && t.projectId === task.projectId && !isArchivedForUser(t, appUser)).map(t => t.id)
                    : [task.id];
                const siblings = projectTasks.filter(t => t.sectionId === task.sectionId);
                const i = siblings.findIndex(t => t.id === task.id);
                const nxt = siblings.slice(i + 1).find(t => !ids.includes(t.id));
                setTaskDrag({ id: task.id, ids, sectionId: task.sectionId, beforeId: nxt ? nxt.id : null });
            };
            const handleTaskDragOver = (e, task) => {
                if (!taskDrag) return;
                e.preventDefault();
                e.stopPropagation();
                if (taskDrag.ids.includes(task.id)) return;
                const rect = layoutRect(e.currentTarget.parentElement || e.currentTarget);
                const after = e.clientY > rect.top + rect.height / 2;
                const list = displayTasksFor(task.sectionId).filter(t => !taskDrag.ids.includes(t.id));
                const i = list.findIndex(t => t.id === task.id);
                const beforeId = after ? (list[i + 1] ? list[i + 1].id : null) : task.id;
                if (taskDrag.sectionId === task.sectionId && taskDrag.beforeId === beforeId) return;
                setTaskDrag(prev => prev ? { ...prev, sectionId: task.sectionId, beforeId } : prev);
            };
            const handleTaskListDragOver = (e, sectionId) => {
                if (!taskDrag) return;
                e.preventDefault();
                const cards = e.currentTarget.querySelectorAll('[data-type="task"]');
                let atEnd = true;
                if (cards.length) atEnd = e.clientY > cards[cards.length - 1].getBoundingClientRect().bottom;
                if (!atEnd) return;
                if (taskDrag.sectionId === sectionId && taskDrag.beforeId === null) return;
                setTaskDrag(prev => prev ? { ...prev, sectionId, beforeId: null } : prev);
            };
            const commitTaskDrag = () => {
                if (!taskDrag) return;
                const idSet = new Set(taskDrag.ids);
                const movedList = tasks.filter(t => idSet.has(t.id)).map(t => ({ ...t, sectionId: taskDrag.sectionId }));
                if (movedList.length) {
                    const rest = tasks.filter(t => !idSet.has(t.id));
                    const idx = taskDrag.beforeId ? rest.findIndex(t => t.id === taskDrag.beforeId) : -1;
                    if (idx === -1) rest.push(...movedList); else rest.splice(idx, 0, ...movedList);
                    setTasks(rest);
                }
                setTaskDrag(null);
            };

            // ---- Projects ----
            const handleProjectDragStart = (e, project) => {
                if (!canSortProject) { e.preventDefault(); return; }
                const ids = (selectedProjectIds.has(project.id) && selectedProjectIds.size > 1)
                    ? visibleProjects.filter(p => selectedProjectIds.has(p.id)).map(p => p.id)
                    : [project.id];
                e.dataTransfer.effectAllowed = 'move';
                try { e.dataTransfer.setData('text/plain', project.id); } catch (err) {}
                setProjDrag({ ids, order: visibleProjects.map(p => p.id) });
            };
            const handleProjectDragOver = (e, project) => {
                if (!projDrag) return;
                e.preventDefault();
                e.stopPropagation();
                e.dataTransfer.dropEffect = 'move';
                if (projDrag.ids.includes(project.id)) return;
                const rect = e.currentTarget.getBoundingClientRect();
                const after = e.clientY > rect.top + rect.height / 2;
                setProjDrag(prev => {
                    if (!prev) return prev;
                    const next = moveGroup(prev.order, prev.ids, project.id, after);
                    return sameOrder(next, prev.order) ? prev : { ...prev, order: next };
                });
            };
            const commitProjDrag = () => {
                if (!projDrag) return;
                setProjects(reorderSubset(projects, projDrag.order));
                setProjDrag(null);
            };

            // ---- Sections ----
            const handleSectionDragStart = (e, section) => {
                if (isViewer) { e.preventDefault(); return; }
                const ids = (selectedSectionIds.has(section.id) && selectedSectionIds.size > 1)
                    ? currentSections.filter(x => selectedSectionIds.has(x.id)).map(x => x.id)
                    : [section.id];
                e.dataTransfer.effectAllowed = 'move';
                try { e.dataTransfer.setData('text/plain', section.id); } catch (err) {}
                setSecDrag({ ids, order: currentSections.map(x => x.id) });
            };
            const handleSectionDragOver = (e, section) => {
                if (!secDrag) return;
                e.preventDefault();
                if (secDrag.ids.includes(section.id)) return;
                const rect = e.currentTarget.getBoundingClientRect();
                const after = e.clientX > rect.left + rect.width / 2;
                setSecDrag(prev => {
                    if (!prev) return prev;
                    const next = moveGroup(prev.order, prev.ids, section.id, after);
