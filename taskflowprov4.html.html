                    return sameOrder(next, prev.order) ? prev : { ...prev, order: next };
                });
            };
            const commitSecDrag = () => {
                if (!secDrag) return;
                setSections(reorderSubset(sections, secDrag.order));
                setSecDrag(null);
            };

            // --- Storage (per-account archive) ---
            const archKey = (type, id) => type + ':' + id;
            const groupArchKeys = (keys) => {
                const g = { project: [], section: [], task: [] };
                keys.forEach(k => { const i = k.indexOf(':'); const t = k.slice(0, i); if (g[t]) g[t].push(k.slice(i + 1)); });
                return g;
            };
            const handleArchiveCardClick = (e, key) => {
                if (e.ctrlKey || e.metaKey || e.shiftKey) {
                    const n = new Set(selectedArchiveKeys);
                    if (n.has(key)) n.delete(key); else n.add(key);
                    setSelectedArchiveKeys(n);
                } else if (key.startsWith('task:')) {
                    setSelectedArchiveKeys(new Set());
                    setSelectedTaskId(key.slice(5));
                    setTaskModalOpen(true);
                } else {
                    setSelectedArchiveKeys(new Set([key]));
                }
            };
            const handleArchiveContextMenu = (e, key) => {
                e.preventDefault();
                e.stopPropagation();
                const keys = selectedArchiveKeys.has(key) ? Array.from(selectedArchiveKeys) : [key];
                if (!selectedArchiveKeys.has(key)) setSelectedArchiveKeys(new Set([key]));
                setContextMenu({ x: e.clientX, y: e.clientY, type: 'archive', keys });
            };
            // Expand a selection: project -> its sections & tasks, section -> its tasks.
            // For restore, also bring back the parents a restored section / task needs to be visible.
            const expandArchKeys = (keys, forRestore) => {
                const g = groupArchKeys(keys);
                const P = new Set(g.project), S = new Set(g.section), T = new Set(g.task);
                const isAdmin = appUser.role === 'admin';
                const eligible = (item) => forRestore ? inUserStorage(item, appUser) : true;
                sections.forEach(x => { if (P.has(x.projectId) && eligible(x)) S.add(x.id); });
                tasks.forEach(t => { if ((P.has(t.projectId) || S.has(t.sectionId)) && eligible(t)) T.add(t.id); });
                if (forRestore) {
                    tasks.forEach(t => { if (T.has(t.id)) { const sec = sections.find(x => x.id === t.sectionId); if (sec && inUserStorage(sec, appUser)) S.add(sec.id); } });
                    sections.forEach(x => { if (S.has(x.id)) { const pr = projects.find(p => p.id === x.projectId); if (pr && inUserStorage(pr, appUser)) P.add(pr.id); } });
                }
                return { P, S, T };
            };
            const restoreArchived = (keys) => {
                const { P, S, T } = expandArchKeys(keys, true);
                setProjects(projects.map(p => P.has(p.id) ? markRestored(p, appUser) : p));
                setSections(sections.map(x => S.has(x.id) ? markRestored(x, appUser) : x));
                setTasks(tasks.map(x => T.has(x.id) ? markRestored(x, appUser) : x));
                setSelectedArchiveKeys(new Set());
                setContextMenu(null);
                triggerToast(`Restored ${keys.length} item${keys.length > 1 ? 's' : ''}.`);
            };
            const deleteArchived = (keys) => {
                const isAdmin = appUser.role === 'admin';
                const msg = isAdmin
                    ? `Permanently delete ${keys.length} item(s) and everything inside them? This cannot be undone and affects everyone.`
                    : `Remove ${keys.length} item(s) from your Storage? Other members are not affected.`;
                setContextMenu(null);
                if (!window.confirm(msg)) return;
                const { P, S, T } = expandArchKeys(keys, false);
                if (isAdmin) {
                    setTasks(tasks.filter(t => !T.has(t.id)));
                    setSections(sections.filter(x => !S.has(x.id)));
                    setProjects(projects.filter(p => !P.has(p.id)));
                } else {
                    setProjects(projects.map(p => P.has(p.id) ? markRemoved(p, appUser) : p));
                    setSections(sections.map(x => S.has(x.id) ? markRemoved(x, appUser) : x));
                    setTasks(tasks.map(x => T.has(x.id) ? markRemoved(x, appUser) : x));
                }
                setSelectedArchiveKeys(new Set());
                triggerToast(`Deleted ${keys.length} item${keys.length > 1 ? 's' : ''}.`);
            };
            const renderArchiveCard = (type, id, title, sub, by) => {
                const key = archKey(type, id);
                const sel = selectedArchiveKeys.has(key);
                return (
                    <div
                        key={key}
                        data-type={'arch-' + type}
                        data-selection-id={key}
                        onClick={(e) => handleArchiveCardClick(e, key)}
                        onContextMenu={(e) => handleArchiveContextMenu(e, key)}
                        className={`arch-card select-none cursor-pointer bg-white p-4 rounded-xl shadow-sm border flex flex-col justify-between relative min-h-[90px] transition-colors ${sel ? 'border-blue-400 ring-1 ring-blue-400 bg-blue-50/30' : 'border-gray-100'}`}
                    >
                        <div>
                            <h4 className="font-medium text-gray-800 block truncate pr-16">{title}</h4>
                            {sub !== undefined && <span className="text-[10px] font-bold text-blue-600 uppercase block mt-1 truncate">{sub || 'Unknown Project'}</span>}
                            {by ? <span className="text-[11px] text-gray-400 block mt-1 truncate">Archived by {by}</span> : null}
                        </div>
                        <button
                            onClick={(e) => { e.stopPropagation(); restoreArchived([key]); }}
                            className="text-sm text-gray-500 font-normal hover:text-gray-700 hover:underline absolute bottom-4 right-4"
                        >
                            Restore
                        </button>
                    </div>
                );
            };

            const displayProjects = projDrag ? projDrag.order.map(id => visibleProjects.find(p => p.id === id)).filter(Boolean) : visibleProjects;
            const displaySections = secDrag ? secDrag.order.map(id => currentSections.find(x => x.id === id)).filter(Boolean) : currentSections;
            dragActiveRef.current = !!(projDrag || secDrag || taskDrag);
            const flipKey = displayProjects.map(p => p.id).join(',') + '|' + displaySections.map(x => x.id + ':' + displayTasksFor(x.id).map(t => t.id).join(',')).join(';');
            const flipRef = useFlip(flipKey);

            const renderArchiveGroup = (groupKey, title, items, renderItem, emptyText) => {
                const collapsible = items.length >= 1;
                const collapsed = collapsible && archCollapsed[groupKey];
                const shown = collapsed ? [] : items;
                return (
                    <div>
                        <div className="flex items-center justify-between mb-3 border-b pb-2">
                            <h2 className="font-semibold text-gray-700">{title} <span className="text-xs font-normal text-gray-400 ml-1">({items.length})</span></h2>
                            {collapsible && (
                                <button
                                    onClick={(e) => { e.stopPropagation(); setArchCollapsed(prev => ({ ...prev, [groupKey]: !prev[groupKey] })); }}
                                    className="text-xs text-gray-500 hover:text-gray-800 flex items-center gap-1 transition-colors"
                                >
                                    {collapsed ? `Expand (${items.length})` : 'Collapse'}
                                    <svg className={`w-3.5 h-3.5 transition-transform ${collapsed ? '' : 'rotate-180'}`} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" /></svg>
                                </button>
                            )}
                        </div>
                        {items.length === 0 ? <p className="text-sm text-gray-500">{emptyText}</p> : collapsed ? null : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                {shown.map(renderItem)}
                            </div>
                        )}
                    </div>
                );
            };

            // --- Keyboard shortcuts ---
            // T new task · S new section · P new project · Del delete selected · R restore · D mark complete · 1-4 status
            hotkeyRef.current = (e) => {
                if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
                const t = e.target;
                if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
                if (taskModalOpen || shareModalOpen) return;
                const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
                const inProject = currentView === 'projects' && !!selectedProjectId;
                const myName = (appUser.username || '').toLowerCase();
                const canChange = (tk) => canEditProj(tk.projectId) || (tk.assignee && tk.assignee.toLowerCase() === myName) || tk.assigneeId === appUser.id;
                const pickTasks = (pred) => Array.from(selectedTaskIds).map(id => tasks.find(x => x.id === id)).filter(x => x && pred(x));

                if (key === 't') {
                    if (!inProject || !isEditorOrAdmin) return;
                    e.preventDefault();
                    const elUnder = document.elementFromPoint(mouseRef.current.x, mouseRef.current.y);
                    const wrap = elUnder && elUnder.closest ? elUnder.closest('[data-type="section"]') : null;
                    const hovered = wrap ? currentSections.find(x => x.id === wrap.dataset.selectionId) : null;
                    const picked = selectedSectionIds.size === 1 ? currentSections.find(x => selectedSectionIds.has(x.id)) : null;
                    const sec = hovered || picked || currentSections[0];
                    if (!sec) { triggerToast("Create a section first (press S)."); return; }
                    handleAddTask(sec.id);
                } else if (key === 's') {
                    if (!inProject || !isEditorOrAdmin) return;
                    e.preventDefault();
                    setIsAddingSection(true);
                } else if (key === 'p') {
                    if (appUser.role !== 'admin' && appUser.role !== 'editor') return;
                    e.preventDefault();
                    setIsAddingProject(true);
                } else if (key === 'Delete') {
                    if (currentView === 'archived') {
                        if (selectedArchiveKeys.size) { e.preventDefault(); deleteArchived(Array.from(selectedArchiveKeys)); }
                        return;
                    }
                    const delT = new Set(pickTasks(tk => canEditProj(tk.projectId)).map(x => x.id));
                    const delS = new Set(Array.from(selectedSectionIds).filter(id => { const sc = sections.find(x => x.id === id); return sc && canEditProj(sc.projectId); }));
                    const delP = new Set(Array.from(selectedProjectIds).filter(id => canEditProj(id)));
                    const total = delT.size + delS.size + delP.size;
                    if (!total) return;
                    e.preventDefault();
                    if (!window.confirm(`Delete ${total} selected item${total > 1 ? 's' : ''}? Everything inside them is deleted too.`)) return;
                    setTasks(tasks.filter(x => !delT.has(x.id) && !delS.has(x.sectionId) && !delP.has(x.projectId)));
                    setSections(sections.filter(x => !delS.has(x.id) && !delP.has(x.projectId)));
                    setProjects(projects.filter(x => !delP.has(x.id)));
                    if (delP.has(selectedProjectId)) setSelectedProjectId(null);
                    setSelectedTaskIds(new Set());
                    setSelectedSectionIds(new Set());
                    setSelectedProjectIds(new Set());
                    triggerToast(`Deleted ${total} item${total > 1 ? 's' : ''}.`);
                } else if (key === 'r') {
                    if (currentView === 'archived' && selectedArchiveKeys.size) {
                        e.preventDefault();
                        restoreArchived(Array.from(selectedArchiveKeys));
                    }
                } else if (key === 'd') {
                    const dT = pickTasks(tk => canEditProj(tk.projectId)).map(x => x.id);
                    const dS = Array.from(selectedSectionIds).filter(id => { const sc = sections.find(x => x.id === id); return sc && canEditProj(sc.projectId); });
                    const dP = Array.from(selectedProjectIds).filter(id => canEditProj(id));
                    if (!dT.length && !dS.length && !dP.length) return;
                    e.preventDefault();
                    const n = duplicateMany(dT, dS, dP);
                    if (n) triggerToast(`Duplicated ${n} item${n > 1 ? 's' : ''}.`);
                } else if (key === 'c') {
                    const picked = pickTasks(canChange);
                    const ids = new Set(picked.map(x => x.id));
                    if (!ids.size) return;
                    e.preventDefault();
                    // toggle: if everything selected is already complete -> un-mark, otherwise mark complete
                    const allDone = picked.every(x => x.completed);
                    if (allDone) {
                        setTasks(tasks.map(x => ids.has(x.id) ? { ...x, completed: false, status: x.status === 'Done' ? 'In Progress' : x.status } : x));
                        triggerToast(`Unmarked ${ids.size} item${ids.size > 1 ? 's' : ''}.`);
                    } else {
                        setTasks(tasks.map(x => ids.has(x.id) ? { ...x, completed: true, status: 'Done' } : x));
                        triggerToast(`Marked ${ids.size} item${ids.size > 1 ? 's' : ''} as complete.`);
                    }
                } else if (['1', '2', '3', '4'].includes(key)) {
                    const status = { '1': 'To Do', '2': 'In Progress', '3': 'Review', '4': 'Done' }[key];
                    const ids = new Set(pickTasks(canChange).map(x => x.id));
                    if (!ids.size) return;
                    e.preventDefault();
                    setTasks(tasks.map(x => ids.has(x.id) ? { ...x, status, completed: status === 'Done' } : x));
                    triggerToast(`Status set to ${status} for ${ids.size} item${ids.size > 1 ? 's' : ''}.`);
                }
            };

            return (
                <div className="flex h-screen bg-gray-50 text-gray-900 font-sans overflow-hidden">
                    {/* Marquee Selection Box Overlay */}
                    {selectionBox && (
                        <div 
                            className="fixed bg-blue-500/20 border border-blue-500 pointer-events-none z-[100]"
                            style={{
                                left: Math.min(selectionBox.startX, selectionBox.currentX),
                                top: Math.min(selectionBox.startY, selectionBox.currentY),
                                width: Math.abs(selectionBox.currentX - selectionBox.startX),
                                height: Math.abs(selectionBox.currentY - selectionBox.startY)
                            }}
                        />
                    )}

                    {/* Sidebar */}

                                    ) : (

                    {inviteSettingOpen && appUser.role === 'admin' && <InviteSettingModal onClose={() => setInviteSettingOpen(false)} triggerToast={triggerToast} appUser={appUser} />}

                    {/* Task Detail Modal */}
                    {taskModalOpen && activeTask && (

                    {shareModalOpen && currentProject && (

                            <button onClick={() => deleteArchived(contextMenu.keys)} className="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors flex items-center gap-2">
                                <Trash2 className="w-4 h-4" /> Delete
                            </button>
                        </div>
                    )}

                    {/* Context Menu */}
                    {contextMenu && contextMenu.type !== 'archive' && (
                        <div 
                            data-ctx-menu
                            className="fixed bg-white border border-gray-200 shadow-xl rounded-lg py-1 z-[100] w-48 animate-in fade-in zoom-in duration-100"
                            style={{ top: contextMenu.y, left: contextMenu.x }}
                        >
                            {(contextMenu.type === 'task' || contextMenu.type === 'section' || contextMenu.type === 'project') && !contextMenu.limited && (
                                <>
                                    {contextMenu.type !== 'task' && (

                                    {!contextMenu.limited && (

                                    {contextMenu.type === 'bulk-task' && (

                                                </button>
                                                <div className="absolute left-full top-0 ml-1 hidden group-hover/assign:block bg-white border border-gray-200 shadow-xl rounded-lg py-1 w-48 max-h-48 overflow-y-auto scrollbar-thin">
                                                    <button onClick={() => handleBulkAction('assignee', null)} className="w-full text-left px-4 py-2 text-sm text-gray-500 italic hover:bg-gray-100">Unassigned</button>
                                                    {users.map(u => (

        // --- My Tasks View with Kanban columns ---
        function MyTasksView({ tasks, projects, sections, appUser, users, onUpdateTask, onSelectTask, onContextMenu, selectedTaskIds, setSelectedTaskIds, headerExtra, unreadTaskIds }) {
            // Updated filtering logic: 
            // - Admins/Editors see ALL tasks they have access to, or just tasks assigned to them? The user requested assignee to be seen everywhere.
            // Let's filter to: Tasks where you are assignee, OR (Admin/Editor see all? No, MyTasks usually only shows tasks assigned to you).
            const myTasks = tasks.filter(t => {
                if (isArchivedForUser(t, appUser)) return false;
                const isAssignee = t.assignee?.toLowerCase() === appUser.username?.toLowerCase() || t.assigneeId === appUser.id;
                
                // If they are assignee, show it.
                if (isAssignee) return true;
                
                // If Admin, show everything? Normally MyTasks is personal. But previous logic said: 
                // t.assignee === 'admin' && appUser.role === 'admin'. We will stick to just personal tasks for My Tasks.
                if (appUser.role === 'admin' && (t.assignee === 'admin' || t.assigneeId === 'admin_sys')) return true;
                
                return false;
            });
            const columns = ['To Do', 'In Progress', 'Review', 'Done'];

            const [taskOrder, setTaskOrder] = useState(() => JSON.parse(localStorage.getItem(`tf_mytasks_order_${appUser.username}`)) || []);
            const [drag, setDrag] = useState(null); // { ids, status, beforeId }
            const dragStateRef = useRef(null);
            dragStateRef.current = drag;
            useEffect(() => {
                const clear = () => setDrag(null);
                const mv = (e) => { if (dragStateRef.current && e.buttons === 0) setDrag(null); };
                window.addEventListener('dragend', clear);
                window.addEventListener('mousemove', mv);
                return () => { window.removeEventListener('dragend', clear); window.removeEventListener('mousemove', mv); };
            }, []);

            const sortedMyTasks = [...myTasks].sort((a, b) => {
                const idxA = taskOrder.indexOf(a.id);
                const idxB = taskOrder.indexOf(b.id);
                if (idxA === -1 && idxB === -1) return 0;
                if (idxA === -1) return 1;
                if (idxB === -1) return -1;
                return idxA - idxB;
            });

            // dragging a selected card moves every selected card
            const dragIdsFor = (id) => (selectedTaskIds && selectedTaskIds.has(id) && selectedTaskIds.size > 1)
                ? sortedMyTasks.filter(t => selectedTaskIds.has(t.id)).map(t => t.id) : [id];
            const displayFor = (status) => {
                const base = sortedMyTasks.filter(t => t.status === status && !(drag && drag.ids.includes(t.id)));
                if (drag && drag.status === status) {
                    const moved = sortedMyTasks.filter(t => drag.ids.includes(t.id));
                    let idx = drag.beforeId ? base.findIndex(t => t.id === drag.beforeId) : -1;
                    if (idx === -1) idx = base.length;
                    base.splice(idx, 0, ...moved);
                }
                return base;
            };
            const handleDragStart = (e, id, status) => {
                e.stopPropagation();
                e.dataTransfer.effectAllowed = 'move';
                try { e.dataTransfer.setData('text/plain', id); } catch (err) {}
                const ids = dragIdsFor(id);
                const list = sortedMyTasks.filter(t => t.status === status);
                const i = list.findIndex(t => t.id === id);
                const nxt = list.slice(i + 1).find(t => !ids.includes(t.id));
                setDrag({ ids, status, beforeId: nxt ? nxt.id : null });
            };
            const handleDragOver = (e, task, status) => {
                if (!drag) return;
                e.preventDefault();
                e.stopPropagation();
                if (drag.ids.includes(task.id)) return;
                const rect = layoutRect(e.currentTarget.parentElement || e.currentTarget);
                const after = e.clientY > rect.top + rect.height / 2;
                const list = displayFor(status).filter(t => !drag.ids.includes(t.id));
                const i = list.findIndex(t => t.id === task.id);
                const beforeId = after ? (list[i + 1] ? list[i + 1].id : null) : task.id;
                if (drag.status === status && drag.beforeId === beforeId) return;
                setDrag(prev => prev ? { ...prev, status, beforeId } : prev);
            };
            const handleColDragOver = (e, status) => {
                if (!drag) return;
                e.preventDefault();
                const cards = e.currentTarget.querySelectorAll('[data-type="task"]');
                let atEnd = true;
                if (cards.length) atEnd = e.clientY > cards[cards.length - 1].getBoundingClientRect().bottom;
                if (!atEnd) return;
                if (drag.status === status && drag.beforeId === null) return;
                setDrag(prev => prev ? { ...prev, status, beforeId: null } : prev);
            };
            const commitDrag = (e) => {
                if (e) { e.preventDefault(); e.stopPropagation(); }
                if (!drag) return;
                const { ids, status, beforeId } = drag;
                ids.forEach(id => {
                    const dt = myTasks.find(t => t.id === id);
                    if (dt && dt.status !== status) onUpdateTask(id, { status });
                });
                let currentOrder = [...taskOrder];
                sortedMyTasks.forEach(t => { if (!currentOrder.includes(t.id)) currentOrder.push(t.id); });
                const movedIds = currentOrder.filter(x => ids.includes(x));
                currentOrder = currentOrder.filter(x => !ids.includes(x));
                const at = beforeId ? currentOrder.indexOf(beforeId) : -1;
                if (at === -1) currentOrder.push(...movedIds); else currentOrder.splice(at, 0, ...movedIds);
                setTaskOrder(currentOrder);
                localStorage.setItem(`tf_mytasks_order_${appUser.username}`, JSON.stringify(currentOrder));
                setDrag(null);
            };
            const flipRefMy = useFlip(columns.map(st => st + ':' + displayFor(st).map(t => t.id).join(',')).join(';'));

            return (
                <div className="flex flex-col h-full overflow-hidden">
                    <header className="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 flex-shrink-0 shadow-sm z-10">
                        <h1 className="text-xl font-bold text-gray-800">My Tasks</h1>
                        {headerExtra}
                    </header>
                    <div className="flex-1 overflow-x-auto p-6">
                        {myTasks.length === 0 ? (
                            <div className="h-full flex flex-col items-center justify-center text-gray-400">
                                <Layout className="w-12 h-12 mb-3 text-gray-300" />
                                <p className="text-base font-medium text-gray-500">No task assignments yet</p>
                            </div>
                        ) : (
                            <div className="flex h-full space-x-6">
                                {columns.map(status => {
                                    const colTasks = displayFor(status);
                                    return (
                                        <div 
                                            key={status} 
                                            className="w-80 flex-shrink-0 flex flex-col h-full bg-gray-100/50 rounded-2xl p-4 border border-gray-200"
                                            onDragOver={(e) => handleColDragOver(e, status)}
                                            onDrop={(e) => commitDrag(e)}
                                        >
                                            <div className="flex items-center justify-between mb-4 px-1">
                                                <h3 className="font-semibold text-gray-700">{status}</h3>
                                                <span className="text-xs font-medium text-gray-500 bg-gray-200 px-2 py-0.5 rounded-full">{colTasks.length}</span>
                                            </div>
                                            <div className="flex-1 overflow-y-auto space-y-3 pb-4 px-1 scrollbar-thin">
                                                {colTasks.map(task => {
                                                    const proj = projects.find(p => p.id === task.projectId);
                                                    const isEditorOrAdmin = appUser.role === 'admin' || !!proj?.members?.some(m => m.email?.toLowerCase() === appUser.username?.toLowerCase() && m.role === 'editor');
                                                    const canCheck = isEditorOrAdmin || task.assignee?.toLowerCase() === appUser.username?.toLowerCase() || task.assigneeId === appUser.id;
                                                    
                                                    const dateFormatted = task.endDateObj ? formatTaskDateDisplay(task.endDateObj) : null;
                                                    const completedSubtasks = (task.subtasks || []).filter(st => st.completed).length;
                                                    const totalSubtasks = (task.subtasks || []).length;
                                                    const attachCount = (task.attachments || []).length;
                                                    const commentCount = (task.comments || []).length;
                                                    const isBeingDragged = !!(drag && drag.ids.includes(task.id));
                                                    const isSelected = selectedTaskIds && selectedTaskIds.has(task.id);

                                                    return (
                                                        <div 
                                                            key={task.id} 
                                                            ref={flipRefMy('t:' + task.id)}
                                                            className={`relative transition-opacity duration-150 ${isBeingDragged ? 'opacity-40' : ''}`}
                                                            data-type="task"
                                                            data-selection-id={task.id}
                                                        >
                                                            {unreadTaskIds && unreadTaskIds.has(task.id) && <span className="absolute top-1.5 right-2 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white z-20 pointer-events-none"></span>}
                                                            
                                                            <div 
                                                                draggable
                                                                onDragStart={(e) => handleDragStart(e, task.id, status)}
                                                                onDragOver={(e) => handleDragOver(e, task, status)}
                                                                onDrop={(e) => commitDrag(e)}
                                                                onDragEnd={() => setDrag(null)}
                                                                onClick={(e) => {
                                                                    if (e.ctrlKey || e.metaKey || e.shiftKey) {
                                                                        const newSet = new Set(selectedTaskIds);
                                                                        if (newSet.has(task.id)) newSet.delete(task.id);
                                                                        else newSet.add(task.id);
                                                                        if (setSelectedTaskIds) setSelectedTaskIds(newSet);
                                                                    } else {
                                                                        onSelectTask(task);
                                                                    }
                                                                }}
                                                                onContextMenu={(e) => {
                                                                    if (isEditorOrAdmin && onContextMenu) onContextMenu(e, 'task', task.id, task.title);
                                                                }}
                                                                className={`task-card bg-white p-4 pr-5 rounded-xl shadow-sm ${isSelected ? 'bg-blue-50/30' : ''} cursor-pointer hover:shadow-md transition-all relative overflow-hidden group cursor-grab active:cursor-grabbing ${task.completed ? 'opacity-60' : ''}`}
                                                            >
                                                                <div className={`absolute top-0 right-0 bottom-0 w-1.5 ${getStatusColorClass(status)}`}></div>
<div className={`absolute inset-0 rounded-xl pointer-events-none z-20 border ${isSelected ? 'border-[2px] border-blue-400' : 'border-gray-100'}`}></div>
                                                                <div className={`flex items-start ${canCheck ? 'gap-3' : 'gap-0'}`}>
                                                                    {canCheck && (
                                                                        <button 
                                                                            onClick={(e) => { 
                                                                                e.stopPropagation(); 
                                                                                onUpdateTask(task.id, { completed: !task.completed }); 
                                                                            }} 
                                                                            className={`mt-0.5 flex-shrink-0 w-5 h-5 rounded-full border flex items-center justify-center transition-colors ${task.completed ? 'bg-green-500 border-green-500 text-white' : 'border-gray-300 hover:border-green-500 text-transparent hover:text-green-200'}`}
                                                                        >
                                                                            <Check className="w-3 h-3" />
                                                                        </button>
                                                                    )}
                                                                    
                                                                    <div className="flex-1 min-w-0">
                                                                        <h4 className={`text-base font-medium truncate mb-1 ${task.completed ? 'line-through text-gray-500' : 'text-gray-900'}`}>{task.title}</h4>
                                                                        <p className="text-[10px] font-bold text-blue-600 uppercase truncate mb-2">
                                                                            {proj ? proj.name : 'Project'} 
                                                                            {(() => {
                                                                                const sec = sections.find(s => s.id === task.sectionId);
                                                                                return sec ? ` - ${sec.name}` : '';
                                                                            })()}
                                                                        </p>
                                                                        
                                                                        <div className="mt-3 flex items-center gap-3.5 text-xs font-normal text-gray-500 flex-wrap">
                                                                            {dateFormatted && (
                                                                                <div className="flex items-center gap-1.5 text-gray-600 font-medium">
                                                                                    <Calendar className="w-3.5 h-3.5 text-gray-400" />
                                                                                    <span>{dateFormatted}</span>
                                                                                </div>
                                                                            )}
                                                                            {totalSubtasks > 0 && (
                                                                                <div className="flex items-center gap-1 text-gray-600">
                                                                                    <ListTodo className="w-3.5 h-3.5 text-gray-400" />
                                                                                    <span>{completedSubtasks}/{totalSubtasks}</span>
                                                                                </div>
                                                                            )}
                                                                            {attachCount > 0 && (
                                                                                <div className="flex items-center gap-1 text-gray-600">
                                                                                    <Paperclip className="w-3.5 h-3.5 text-gray-400" />
                                                                                    <span>{attachCount}</span>
                                                                                </div>
                                                                            )}
                                                                            {commentCount > 0 && (
                                                                                <div className="flex items-center gap-1 text-gray-600">
                                                                                    <MessageSquare className="w-3.5 h-3.5 text-gray-400" />
                                                                                    <span>{commentCount}</span>
                                                                                </div>
                                                                            )}
                                                                        </div>
                                                                        
                                                                        {task.assignee && (
                                                                            <div className="mt-3 flex items-center gap-2">
                                                                                {renderAvatar(users.find(u => u.username === task.assignee || u.email === task.assignee || u.id === task.assigneeId) || { name: task.assignee }, "w-5 h-5 text-[10px]", true)}
                                                                                <span className="text-xs text-gray-500 truncate">{task.assignee}</span>
                                                                            </div>
                                                                        )}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                            
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // --- Invitation e-mail (sent through EmailJS; configured in Admin Panel > Invite Setting) ---
        const DEFAULT_INVITE_CFG = {
            service: '', template: '', key: '', url: '',
            heading: 'Welcome!',
            logoUrl: '',
            desc: '{inviter} invited you to join {project} as {role}.',
            accountLine: 'Your Account: {account}',
            passwordLine: 'Password: {password}',
            sender: '',
            subject: '{inviter} invited you to {project} on TaskFlow Pro',

        // --- Attachment preview (images, PDF, video, audio, text) ---
        function AttachmentPreview({ att, onClose }) {
            const [src, setSrc] = useState(null);
            const [text, setText] = useState(null);
            const mime = ((att.url || '').match(/^data:([^;,]+)/) || [])[1] || '';
            const name = att.name || 'file';
            const ext = (name.split('.').pop() || '').toLowerCase();
            const kind = (att.type === 'image' || mime.startsWith('image/')) ? 'image'
                : (mime === 'application/pdf' || ext === 'pdf') ? 'pdf'
                : mime.startsWith('video/') ? 'video'
                : mime.startsWith('audio/') ? 'audio'
                : (mime.startsWith('text/') || ['txt','md','csv','json','log','xml','html','js','css'].includes(ext)) ? 'text' : 'other';
            useEffect(() => {
                let url = null, dead = false;
                fetch(att.url).then(r => r.blob()).then(async b => {
                    if (dead) return;
                    if (kind === 'text') { const t = await b.text(); if (!dead) setText(t.slice(0, 200000)); return; }
                    const typed = kind === 'pdf' && b.type !== 'application/pdf' ? new Blob([b], { type: 'application/pdf' }) : b;
                    url = URL.createObjectURL(typed); setSrc(url);
                }).catch(() => { if (!dead) setSrc(att.url); });
                const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); onClose(); } };
                window.addEventListener('keydown', onKey, true);
                return () => { dead = true; window.removeEventListener('keydown', onKey, true); if (url) URL.revokeObjectURL(url); };
            }, [att.url]);
            const stop = (e) => e.stopPropagation();
            return (
                <div className="fixed inset-0 z-[100] bg-black/70 backdrop-blur-sm flex items-center justify-center p-4"
                    onMouseDown={stop} onClick={(e) => { e.stopPropagation(); onClose(); }}>

                        <div className="px-4 py-2.5 border-b border-gray-100 flex items-center justify-between gap-3 flex-shrink-0">
                            <span className="text-sm font-semibold text-gray-800 truncate">{name}</span>
                            <div className="flex items-center gap-2 flex-shrink-0">
                                <a href={att.url} download={name} className="text-xs font-medium text-blue-600 hover:bg-blue-50 px-2.5 py-1.5 rounded-md">Download</a>
                                <button onClick={onClose} className="p-1.5 text-gray-400 hover:text-gray-700 hover:bg-gray-100 rounded-full"><X className="w-4 h-4" /></button>
                            </div>
                        </div>
                        <div className="flex-1 overflow-auto bg-gray-50 flex items-center justify-center min-h-[200px]">
                            {kind === 'image' && <img src={att.url} alt={name} className="max-w-full max-h-[80vh] object-contain" />}
                            {kind === 'pdf' && (src ? <iframe src={src} title={name} className="w-full h-[80vh] border-0" /> : <span className="text-sm text-gray-400">Loading...</span>)}
                            {kind === 'video' && (src ? <video src={src} controls className="max-w-full max-h-[80vh]" /> : <span className="text-sm text-gray-400">Loading...</span>)}
                            {kind === 'audio' && (src ? <audio src={src} controls className="m-8" /> : <span className="text-sm text-gray-400">Loading...</span>)}
                            {kind === 'text' && <pre className="w-full max-h-[80vh] overflow-auto p-4 text-xs text-gray-700 whitespace-pre-wrap break-words">{text === null ? 'Loading...' : text}</pre>}
                            {kind === 'other' && (
                                <div className="p-10 text-center">
                                    <Paperclip className="w-10 h-10 text-gray-300 mx-auto mb-3" />
                                    <p className="text-sm text-gray-600 mb-4">No preview available for this file type.</p>
                                    <a href={att.url} download={name} className="px-4 py-2 bg-blue-600 text-white text-sm font-semibold rounded-lg hover:bg-blue-700">Download</a>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // --- Task Modal with Precision Click Outside Protection ---
        function TaskModal({ task, onClose, onUpdateTask, project, users, setUsers, appUser, triggerToast }) {
            const [isEditingDesc, setIsEditingDesc] = useState(false);
            const [descValue, setDescValue] = useState("");

            const [assignSearch, setAssignSearch] = useState("");

            const backdropMouseDownRef = useRef(false);
            const [subArmed, setSubArmed] = useState(null);
            const [subDrag, setSubDrag] = useState(null); // { sid, beforeSid }
            
            const safeRole = (role) => (role || '').toLowerCase();
            const isEditorOrAdmin = safeRole(appUser.role) === 'admin' || !!project?.members?.some(m => safeRole(m.email) === safeRole(appUser.username) && safeRole(m.role) === 'editor');
            const isViewerMode = !isEditorOrAdmin;
            
            const isAssignee = safeRole(task.assignee) === safeRole(appUser.username) || task.assigneeId === appUser.id;
            
            const canEditStatus = isEditorOrAdmin || isAssignee;
            const canEditContent = isEditorOrAdmin; 
            const canCheckTask = isEditorOrAdmin || isAssignee;

            // stable ids so subtasks can be re-ordered
            useEffect(() => {
                if (canEditContent && (task.subtasks || []).some(st => !st.sid)) {
                    onUpdateTask(task.id, { subtasks: task.subtasks.map(st => st.sid ? st : { ...st, sid: 'st_' + Date.now() + Math.random().toString(36).slice(2, 7) }) });
                }
            }, [task.subtasks]);
            useEffect(() => {
                const up = () => setSubArmed(null);
                window.addEventListener('mouseup', up);
                return () => window.removeEventListener('mouseup', up);
            }, []);
            const subsRaw = task.subtasks || [];
            const subsShown = (() => {
                if (!subDrag) return subsRaw;
                const d = subsRaw.find(st => st.sid === subDrag.sid);
                if (!d) return subsRaw;
                const rest = subsRaw.filter(st => st.sid !== subDrag.sid);
                let i = subDrag.beforeSid ? rest.findIndex(st => st.sid === subDrag.beforeSid) : -1;
                if (i === -1) i = rest.length;
                rest.splice(i, 0, d);
                return rest;
            })();
            const subFlip = useFlip(subsShown.map(st => st.sid).join(','));
            const commitSubDrag = () => {
                if (!subDrag) return;
                if (subsShown.some((st, i) => st !== subsRaw[i])) onUpdateTask(task.id, { subtasks: subsShown });
                setSubDrag(null);
                setSubArmed(null);
            };

            useEffect(() => {
                if (!isEditingDesc) setDescValue(task.description || "");
            }, [task.description, isEditingDesc]);

            useEffect(() => {
                if (!isTitleFocused) setTitleValue(task.title || "");
            }, [task.title, isTitleFocused]);

            const handleDescBlur = () => {
                setIsEditingDesc(false);
                if (descValue !== task.description) {
                    onUpdateTask(task.id, { description: descValue });
                }
            };

            const renderTextWithLinks = (text) => {
                if (!text) return null;
                const urlRegex = /(https?:\/\/[^\s]+)/g;
                const parts = text.split(urlRegex);
                return parts.map((part, i) => {
                    if (part.match(urlRegex)) {
                        return <a key={i} href={part} target="_blank" rel="noopener noreferrer" className="text-blue-600 hover:underline" onClick={(e) => e.stopPropagation()}>{part}</a>;
                    }
                    return <span key={i}>{part}</span>;
                });
            };

            const taskLiveRef = useRef(task);
            taskLiveRef.current = task;
            const handleFilesUpload = async (files, callback) => {
                const out = [];
                for (const f of files) {
                    try { out.push(await prepareAttachment(f)); }
                    catch (err) { triggerToast(`"${f.name || 'File'}" is too large to attach (files up to ~500KB, images are shrunk automatically).`); }

            const openInviteFor = (acctUser, emailAddr) => {
                if (!project) return;
                const addr = (emailAddr || acctUser?.username || '').toLowerCase();
                const mem = (project.members || []).find(m => (m.email || '').toLowerCase() === addr);

                    to: addr, inviter: appUser.name, projectName: project.name,

                }, triggerToast);
            };
            const handleSendTaskMail = () => {
                if (!task || !task.assignee || !project) return;
                openInviteFor(users.find(u => (u.username || '').toLowerCase() === String(task.assignee).toLowerCase()), task.assignee);
                return;
                const subject = `TASK - ${project.name.toUpperCase()}`;
                const subtaskNames = task.subtasks && task.subtasks.length > 0 ? task.subtasks.map(st => st.title).join(', ') : 'None';
                const endDateFormatted = task.endDateObj ? formatTaskDateDisplay(task.endDateObj) : 'N/A';
                const body = `Project: ${project.name}\nTask: ${task.title}\nSubtasks: ${subtaskNames}\nDue Date: ${endDateFormatted || 'N/A'}`;

            const [assignActive, setAssignActive] = useState(-1);
            const assignQuery = (assignSearch || '').trim().toLowerCase();
            const assignMatches = users.filter(u => !assignQuery || (u.username || '').toLowerCase().includes(assignQuery) || (u.name || '').toLowerCase().includes(assignQuery));
            const assignCanInvite = !!assignQuery && assignQuery.includes('@') && !users.some(u => (u.username || '').toLowerCase() === assignQuery);
            const assignItems = [...assignMatches.map(u => ({ user: u })), ...(assignCanInvite ? [{ invite: assignQuery }] : [])];

            const assignUser = (u) => {
                onUpdateTask(task.id, { assignee: u.username, assigneeId: u.id });
                setAssignSearch('');
                setAssignActive(-1);
                setAssignDropOpen(false);
            };

            const handleAssignKeyDown = (e) => {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    setAssignDropOpen(true);
                    if (assignItems.length) setAssignActive(i => (i + 1) % assignItems.length);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (assignItems.length) setAssignActive(i => (i <= 0 ? assignItems.length - 1 : i - 1));
                } else if (e.key === 'Escape') {
                    setAssignDropOpen(false);
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    let item = null;
                    if (assignActive >= 0 && assignItems[assignActive]) item = assignItems[assignActive];
                    else {
                        const exact = users.find(u => (u.username || '').toLowerCase() === assignQuery);
                        if (exact) item = { user: exact };
                        else if (assignCanInvite) item = { invite: assignQuery };
                        else if (assignMatches.length === 1 && assignQuery) item = { user: assignMatches[0] };
                    }
                    if (item && item.user) assignUser(item.user);
                    else if (item && item.invite) { createAndAssignUser(item.invite); setAssignActive(-1); }
                }
            };

            const createAndAssignUser = (email) => {
                const cleanEmail = email.trim().toLowerCase();
                const newUserObj = {
                    id: 'usr_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                    name: cleanEmail.split('@')[0],
                    username: cleanEmail,
                    password: '123',
                    role: 'member',
                    avatarBg: AVATAR_BG_COLORS[Math.floor(Math.random() * AVATAR_BG_COLORS.length)]
                };

        // --- Share Modal Component ---
        function ShareModal({ project, projects, setProjects, users, setUsers, onClose, triggerToast, appUser }) {
            const [inviteEmail, setInviteEmail] = useState("");
            const [inviteRole, setInviteRole] = useState("member");
            const [shareError, setShareError] = useState("");
            const [dropdownOpen, setDropdownOpen] = useState(false);
            const [activeIdx, setActiveIdx] = useState(-1);

            const shareQuery = inviteEmail.trim().toLowerCase();
            const shareMatches = users.filter(u => !shareQuery || (u.username || '').toLowerCase().includes(shareQuery) || (u.name || '').toLowerCase().includes(shareQuery));
            const shareCanInviteNew = !!shareQuery && shareQuery.includes('@') && !users.some(u => (u.username || '').toLowerCase() === shareQuery);
            const shareItems = [...shareMatches.map(u => ({ email: u.username })), ...(shareCanInviteNew ? [{ email: shareQuery }] : [])];

            const handleShareKeyDown = (e) => {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    setDropdownOpen(true);
                    if (shareItems.length) setActiveIdx(i => (i + 1) % shareItems.length);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (shareItems.length) setActiveIdx(i => (i <= 0 ? shareItems.length - 1 : i - 1));
                } else if (e.key === 'Escape') {
                    setDropdownOpen(false);
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    let target = null;
                    if (activeIdx >= 0 && shareItems[activeIdx]) target = shareItems[activeIdx].email;
                    else if (shareQuery.includes('@')) target = shareQuery;
                    else if (shareMatches.length === 1) target = shareMatches[0].username;
                    if (target) { handleShare(target); setDropdownOpen(false); setActiveIdx(-1); }
                }
            };

            const handleShare = (e) => {
                if (e && e.preventDefault) e.preventDefault();
                const cleanEmail = (typeof e === 'string' ? e : inviteEmail).trim().toLowerCase();
                if (!cleanEmail) return;

                const existingMembers = project.members || [];
                if (existingMembers.some(m => m.email?.toLowerCase() === cleanEmail)) {
                    setShareError("This email has already been added.");
                    return;
                }

                const newMember = { email: cleanEmail, role: inviteRole };
                const updatedMembers = [...existingMembers, newMember];
                setProjects(prev => prev.map(p => p.id === project.id ? { ...p, members: [...(p.members || []).filter(m => m.email?.toLowerCase() !== cleanEmail), newMember] } : p));

                // create the account if it does not exist yet (checked against the latest list, never overwrites others)
                setUsers(prev => (prev || []).some(u => (u.username || '').toLowerCase() === cleanEmail) ? prev : [...prev, {
                    id: 'usr_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                    name: cleanEmail.split('@')[0],
                    username: cleanEmail,
                    password: '123',
                    role: 'member',
                    avatarBg: AVATAR_BG_COLORS[Math.floor(Math.random() * AVATAR_BG_COLORS.length)]
                }]);

                triggerToast(`Invited ${cleanEmail} as ${inviteRole}`);

                const exist = users.find(u => (u.username || '').toLowerCase() === cleanEmail);
                sendInviteEmail({ to: cleanEmail, inviter: appUser ? appUser.name : 'Admin', projectName: project.name, role: inviteRole, account: cleanEmail, password: (!exist || exist.password === '123') ? '123' : '(your current password)' }, triggerToast);

                setInviteEmail("");
                setInviteRole("member");
                setShareError("");
            };

            const handleUpdateRole = (idx, newRole) => {
                const updated = [...(project.members || [])];
                updated[idx] = { ...updated[idx], role: newRole };
                setProjects(prev => prev.map(p => p.id === project.id ? { ...p, members: updated } : p));

                triggerToast("Role updated.");
            };

            const handleRemove = (idx) => {
                const memberToRemove = (project.members || [])[idx];
                if (memberToRemove?.email === 'admin' || memberToRemove?.email === 'admin@taskflow.com') {
                    triggerToast("System Admin cannot be removed.");
                    return;
                }
                const updated = (project.members || []).filter((_, i) => i !== idx);
                setProjects(prev => prev.map(p => p.id === project.id ? { ...p, members: updated } : p));
                triggerToast("Member removed from project.");
            };

            return (<>
                <div 
                    className="fixed inset-0 bg-black/40 z-[60] flex items-center justify-center p-4 backdrop-blur-sm"
                    onClick={onClose}
                >
                    <div 
                        className="bg-white rounded-2xl shadow-xl w-full max-w-md flex flex-col animate-in fade-in zoom-in-95 duration-200"
                        onClick={(e) => e.stopPropagation()}
                    >
                        <div className="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-gray-50/50 rounded-t-2xl">
                            <h3 className="font-semibold text-gray-800 flex items-center gap-2">
                                <Users className="w-5 h-5 text-blue-600" /> Share "{project.name}"
                            </h3>
                            <button onClick={onClose} className="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-full transition-colors">
                                <X className="w-5 h-5" />
                            </button>
                        </div>
                        
                        <div className="p-6 overflow-visible">
                            <div className="flex flex-col gap-2 mb-6">
                                <div className="flex gap-2 relative">
                                    <div className="flex-1 relative">
                                        <input 
                                            type="text"
                                            autoComplete="off"
                                            placeholder="Invite by email..."
                                            value={inviteEmail}
                                            onKeyDown={handleShareKeyDown}
                                            onChange={(e) => { setInviteEmail(e.target.value); setActiveIdx(-1); if (shareError) setShareError(""); setDropdownOpen(true); }}
                                            onFocus={() => setDropdownOpen(true)}
                                            onBlur={() => setTimeout(() => setDropdownOpen(false), 200)}
                                            className={`w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder:font-normal outline-none ${shareError ? 'border-red-500' : 'border-gray-300'}`}
                                        />
                                        {dropdownOpen && (
                                            <div className="absolute top-full left-0 right-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-xl z-[70] max-h-48 overflow-y-auto scrollbar-thin">
                                                {shareMatches.map((u, i) => (
                                                    <button 
                                                        key={u.id} 
                                                        ref={el => { if (el && i === activeIdx) el.scrollIntoView({ block: 'nearest' }); }}
                                                        onMouseDown={(e) => { e.preventDefault(); setInviteEmail(u.username); setDropdownOpen(false); setActiveIdx(-1); }}
                                                        className={`w-full text-left px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 flex items-center gap-2 truncate rounded ${i === activeIdx ? 'bg-blue-50' : ''}`}
                                                    >
                                                        {renderAvatar(u, "w-5 h-5 text-[10px]")} {u.name} ({u.username})
                                                    </button>
                                                ))}
                                                {shareCanInviteNew && (
                                                    <button 
                                                        onMouseDown={(e) => { e.preventDefault(); handleShare(inviteEmail); setDropdownOpen(false); }}
                                                        className={`w-full text-left px-3 py-2 text-sm text-gray-500 font-normal hover:bg-blue-50 truncate rounded ${activeIdx === shareMatches.length ? 'bg-blue-50' : ''}`}
                                                    >
                                                        Invite "{inviteEmail}"
                                                    </button>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                    <select
                                        value={inviteRole}
                                        onChange={(e) => setInviteRole(e.target.value)}
                                        className="border border-gray-300 rounded-lg text-sm px-2.5 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                                    >
                                        <option value="member">Member</option>
                                        <option value="editor">Editor</option>
                                    </select>
                                    <button onClick={(e) => { e.preventDefault(); handleShare(); }} className="px-4 py-2 bg-blue-600 text-white text-sm font-semibold rounded-lg hover:bg-blue-700 transition-colors">
                                        Invite
                                    </button>
                                </div>
                                {shareError && <span className="text-xs text-red-500 font-medium ml-1">{shareError}</span>}
                            </div>

                            <div>
                                <h4 className="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Project Members</h4>
                                <div className="space-y-3 max-h-52 overflow-y-auto pr-1 scrollbar-thin">
                                    <div className="flex items-center justify-between p-2 rounded-lg bg-gray-50/80">
                                        <div className="flex items-center gap-3">
                                            <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center text-white font-bold text-xs uppercase">ME</div>
                                            <span className="text-sm font-medium text-gray-900">You (Owner)</span>
                                        </div>
                                        <span className="text-xs font-medium text-gray-500 bg-gray-200 px-2 py-1 rounded">Admin</span>
                                    </div>

                                    {(project.members || []).map((member, idx) => (
                                        <div key={idx} className="flex items-center justify-between p-2 rounded-lg hover:bg-gray-50 transition-colors group">
                                            <div className="flex items-center gap-3">
                                                {renderAvatar(users.find(u => u.username === member.email || u.email === member.email) || { name: member.email }, "w-8 h-8 text-xs", true)}

                                            </div>
                                            <div className="flex items-center gap-2">
                                                <select
                                                    value={member.role}
                                                    onChange={(e) => handleUpdateRole(idx, e.target.value)}
                                                    className="text-xs font-medium px-2 py-1 rounded cursor-pointer focus:outline-none border bg-gray-100 text-gray-700"
                                                >
                                                    <option value="member">Member</option>
                                                    <option value="editor">Editor</option>
                                                </select>
                                                <button
                                                    onClick={() => { const ex = users.find(u => (u.username || '').toLowerCase() === (member.email || '').toLowerCase()); sendInviteEmail({ to: member.email, inviter: appUser ? appUser.name : 'Admin', projectName: project.name, role: member.role, account: member.email, password: (!ex || ex.password === '123') ? '123' : '(your current password)' }, triggerToast); }}
                                                    className="opacity-0 group-hover:opacity-100 p-1.5 text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded-md transition-all"
                                                    title="Send invitation email again"
                                                >
                                                    <Send className="w-4 h-4" />
                                                </button>
                                                <button 
                                                    onClick={() => handleRemove(idx)}

                                                    <X className="w-4 h-4" />

                                            </div>

                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </>);
        }

        // --- Other Views (Members, Settings, Login) ---

        // --- Settings View ---
        function SettingsView({ appUser, setAppUser, users, setUsers, triggerToast, handleLogout }) {

                if (!file) return;
                if (file.size > 800000) {
                    triggerToast("Image is too large! Max 800KB.");
                    return;
                }
                const reader = new FileReader();
                reader.onload = (event) => setAvatarUrl(event.target.result);
                reader.readAsDataURL(file);
            };

            const handleSave = (e) => {
                e.preventDefault();
                const updatedUser = { ...appUser, name: name.trim(), password, avatarBg, avatarUrl };
                setAppUser(updatedUser);
                setUsers(users.map(u => u.id === appUser.id ? updatedUser : u));
                triggerToast("Account settings saved!");
            };

            return (
                <div className="flex flex-col h-full overflow-hidden">
                    <header className="h-16 bg-white border-b border-gray-200 flex items-center px-8 flex-shrink-0 shadow-sm z-10">
