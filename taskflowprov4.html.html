        // --- Clean Sign-In Modal when logged out ---
        function LoginScreen({ onLogin, users }) {
            const [username, setUsername] = useState(() => { try { return localStorage.getItem('tf_remember_name') || ""; } catch (e) { return ""; } });
            const [password, setPassword] = useState("");
            const [remember, setRemember] = useState(() => { try { return !!localStorage.getItem('tf_remember_name'); } catch (e) { return false; } });
            const [showPass, setShowPass] = useState(false);
            const [error, setError] = useState("");

            const handleSignIn = (e) => {
                e.preventDefault();
                const cleanUname = username.trim().toLowerCase();
                const matched = users.find(u => u.username.toLowerCase() === cleanUname && u.password === password);
                if (matched) {
                    onLogin(matched, remember);
                } else {
                    setError("Invalid username or password.");
                }
            };

            return (
                <div className="fixed inset-0 bg-gray-50 flex items-center justify-center p-4 z-[200]">
                    <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-200">
                        <div className="flex items-center gap-3 mb-6">
                            <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-md">
                                <CheckCircle className="w-6 h-6" />
                            </div>
                            <div>
                                <h2 className="text-xl font-bold text-gray-900">TaskFlow Pro</h2>
                                <p className="text-xs text-gray-500">Sign in to your workspace</p>
                            </div>
                        </div>

                        {error && (
                            <div className="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-xs rounded-lg font-medium">
                                {error}
                            </div>
                        )}

                        <form onSubmit={handleSignIn} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-1">Username / Email</label>
                                <input 
                                    type="text" 
                                    required
                                    value={username}
                                    onChange={(e) => { setUsername(e.target.value); setError(""); }}
                                    placeholder="Username or email..."
                                    className="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                />
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-1">Password</label>
                                <div className="relative">
                                    <input 
                                        type={showPass ? "text" : "password"} 
                                        required
                                        value={password}
                                        onChange={(e) => { setPassword(e.target.value); setError(""); }}
                                        placeholder="Enter password..."
                                        className="w-full px-3.5 py-2.5 pr-10 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    />
                                    <button 
                                        type="button" 
                                        onClick={() => setShowPass(!showPass)}
                                        className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"
                                    >
                                        {showPass ? <EyeOff className="w-4 h-4" /> : <Eye className="w-4 h-4" />}
                                    </button>
                                </div>
                            </div>

                            <label className="flex items-center gap-2 text-sm text-gray-600 cursor-pointer select-none">
                                <input type="checkbox" checked={remember} onChange={(e) => setRemember(e.target.checked)} className="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
                                Remember me
                            </label>

                            <button type="submit" className="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg text-sm shadow-sm transition-colors mt-2">
                                Sign In
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // --- Render Root with Resilient Firebase Connection ---
        function Root() {
            const [appUser, setAppUser] = useState(() => {
                const saved = sessionStorage.getItem('tf_active_user');
                return saved ? JSON.parse(saved) : null;
            });
            const [data, setData] = useState({ users: null, projects: null, sections: null, tasks: null, events: [] });
            const [useLocalMode, setUseLocalMode] = useState(false);
            const [presence, setPresence] = useState({});
            const [, setTick] = useState(0);
            // Remember me: sign in automatically on a fresh visit
            useEffect(() => {
                if (appUser || !data.users) return;
                try {
                    const r = JSON.parse(localStorage.getItem('tf_remember') || 'null');
                    const u = r && data.users.find(x => x.id === r.id);
                    if (u) {
                        const au = { ...u, isOnline: true };
                        setAppUser(au);
                        sessionStorage.setItem('tf_active_user', JSON.stringify(au));
                    }
                } catch (e) {}
            }, [data.users]);
            const ONLINE_WINDOW_MS = 30000;   // online if a heartbeat was seen within this window
            const HEARTBEAT_MS = 10000;
            const IDLE_MS = 10 * 60 * 1000;   // no mouse / keyboard / touch for this long = not using the account
            const presenceSeen = useRef({});  // when THIS browser last saw a member's heartbeat change (independent of clock differences)
            const presenceVals = useRef({});
            const tokenRef = useRef(null);

            useEffect(() => {
                const initFb = async () => {
                    try {
                        if (!window.fb) await new Promise(r => window.addEventListener('firebase-ready', r));
                        
                        try { await window.fb.signInAnonymously(window.fb.auth); } catch (authErr) { }

                        const getDocRef = (col) => window.fb.doc(window.fb.db, 'artifacts', 'taskflow_pro_v1', 'public', 'data', col, 'all');

                        const handleDbError = (err) => {
                            console.error("Firebase error fallback to local:", err);
                            setUseLocalMode(true);
                        };

                        window.fb.onSnapshot(getDocRef('presence'), snap => {
                            const d = snap.exists() ? snap.data() : {};
                            const nowT = Date.now(), prev = presenceVals.current;
                            Object.keys(d).forEach(uid => {
                                if (!(uid in prev)) presenceSeen.current[uid] = d[uid] ? Math.min(nowT, d[uid]) : 0;
                                else if (prev[uid] !== d[uid]) presenceSeen.current[uid] = d[uid] ? nowT : 0;
                            });
                            presenceVals.current = d;
                            setPresence(d);
                        }, () => {});

                        window.fb.onSnapshot(getDocRef('settings'), snap => {
                            if (snap.exists() && snap.data().invite) setInviteCfgLocal(snap.data().invite);
                        }, () => {});

                        window.fb.onSnapshot(getDocRef('events'), snap => {
                            setData(prev => ({ ...prev, events: snap.exists() ? (snap.data().list || []) : [] }));
                        }, () => {});

                        window.fb.onSnapshot(getDocRef('users'), snap => {
                            if (snap.metadata && snap.metadata.hasPendingWrites) return;
                            if (snap.exists()) setData(prev => ({ ...prev, users: snap.data().items }));
                            else window.fb.setDoc(getDocRef('users'), { items: [{ id: 'admin_sys', username: 'admin', name: 'You (Owner)', password: '123', role: 'admin', avatarBg: 'from-blue-500 to-purple-500' }] }).catch(handleDbError);
                        }, handleDbError);
                        
                        window.fb.onSnapshot(getDocRef('projects'), snap => {
                            if (snap.metadata && snap.metadata.hasPendingWrites) return;
                            if (snap.exists()) setData(prev => ({ ...prev, projects: snap.data().items }));
                            else window.fb.setDoc(getDocRef('projects'), { items: [] }).catch(handleDbError);
                        }, handleDbError);
                        
                        window.fb.onSnapshot(getDocRef('sections'), snap => {
                            if (snap.metadata && snap.metadata.hasPendingWrites) return;
                            if (snap.exists()) setData(prev => ({ ...prev, sections: snap.data().items }));
                            else window.fb.setDoc(getDocRef('sections'), { items: [] }).catch(handleDbError);
                        }, handleDbError);
                        
                        window.fb.onSnapshot(getDocRef('tasks'), snap => {
                            if (snap.metadata && snap.metadata.hasPendingWrites) return;
                            if (snap.exists()) setData(prev => ({ ...prev, tasks: snap.data().items }));
                            else window.fb.setDoc(getDocRef('tasks'), { items: [] }).catch(handleDbError);
                        }, handleDbError);
                    } catch (err) {
                        setUseLocalMode(true);
                    }
                };

                if (!useLocalMode) initFb();
                else {
                    const loadLocal = (key, def) => JSON.parse(localStorage.getItem(key)) || def;
                    setData({
                        users: loadLocal('tf_app_users', [{ id: 'admin_sys', username: 'admin', name: 'You (Owner)', password: '123', role: 'admin', avatarBg: 'from-blue-500 to-purple-500' }]),
                        projects: loadLocal('tf_v4_projects', []),
                        sections: loadLocal('tf_v4_sections', []),
                        tasks: loadLocal('tf_v4_tasks', []),
                        events: loadLocal('tf_events', [])
                    });
                }
            }, [useLocalMode]);

            // Presence: heartbeat while the account is really being used; "offline" on close, logout, idle, lost connection
            useEffect(() => {
                if (!appUser) return;
                const uid = appUser.id;
                const tabId = 't_' + Math.random().toString(36).slice(2);
                const tabsKey = `tf_tabs_${uid}`;
                let lastActive = Date.now();
                const readTabs = () => { try { return JSON.parse(localStorage.getItem(tabsKey) || '{}'); } catch (e) { return {}; } };
                const writeTabs = (o) => { try { localStorage.setItem(tabsKey, JSON.stringify(o)); } catch (e) {} };
                const writePresence = (ts) => {
                    if (useLocalMode || !window.fb || !window.fb.db) { setPresence(p => ({ ...p, [uid]: ts })); return; }
                    try {
                        const ref = window.fb.doc(window.fb.db, 'artifacts', 'taskflow_pro_v1', 'public', 'data', 'presence', 'all');
                        window.fb.setDoc(ref, { [uid]: ts }, { merge: true }).catch(() => {});
                    } catch (e) {}
                };
                const refreshToken = async () => { try { const u = window.fb && window.fb.auth && window.fb.auth.currentUser; if (u) tokenRef.current = await u.getIdToken(); } catch (e) {} };
                // works while the page is being closed (a normal SDK write is usually cancelled then)
                const sendOfflineBeacon = () => {
                    writePresence(0);
                    try {
                        const pid = window.fb && window.fb.db && window.fb.db.app && window.fb.db.app.options && window.fb.db.app.options.projectId;
                        if (useLocalMode || !pid || !tokenRef.current) return;
                        fetch(`https://firestore.googleapis.com/v1/projects/${pid}/databases/(default)/documents/artifacts/taskflow_pro_v1/public/data/presence/all?updateMask.fieldPaths=${encodeURIComponent('`' + uid + '`')}`, {
                            method: 'PATCH', keepalive: true,
                            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tokenRef.current },
                            body: JSON.stringify({ fields: { [uid]: { integerValue: '0' } } })
                        }).catch(() => {});
                    } catch (e) {}
                };
                const beat = () => {
                    if (Date.now() - lastActive > IDLE_MS) return;     // idle: stop reporting, others will see us go offline
                    const tabs = readTabs(); tabs[tabId] = Date.now(); writeTabs(tabs);
                    writePresence(Date.now());
                };
                const markActive = () => { const wasIdle = Date.now() - lastActive > IDLE_MS; lastActive = Date.now(); if (wasIdle) beat(); };
                const goOffline = () => {
                    const tabs = readTabs(); delete tabs[tabId]; writeTabs(tabs);
                    const otherTabAlive = Object.values(tabs).some(ts => Date.now() - ts < ONLINE_WINDOW_MS);
                    if (!otherTabAlive) sendOfflineBeacon();           // another open tab of the same account keeps us online
                };
                const onVisible = () => { if (document.visibilityState === 'visible') { markActive(); beat(); } };
                refreshToken();
                beat();
                const tokenTimer = setInterval(refreshToken, 20 * 60 * 1000);
                // a Worker timer is not throttled in background tabs
                let worker = null, hb = null;
                try {
                    const blob = new Blob([`setInterval(function(){postMessage(1)}, ${HEARTBEAT_MS});`], { type: 'application/javascript' });
                    worker = new Worker(URL.createObjectURL(blob));
                    worker.onmessage = beat;
                } catch (e) { hb = setInterval(beat, HEARTBEAT_MS); }
                const actEvents = ['mousemove', 'mousedown', 'keydown', 'touchstart', 'wheel', 'scroll'];
                actEvents.forEach(ev => window.addEventListener(ev, markActive, { passive: true, capture: true }));
                document.addEventListener('visibilitychange', onVisible);
                window.addEventListener('online', beat);
                window.addEventListener('pagehide', goOffline);
                window.addEventListener('beforeunload', goOffline);
                return () => {
                    clearInterval(tokenTimer);
                    if (hb) clearInterval(hb);
                    if (worker) worker.terminate();
                    actEvents.forEach(ev => window.removeEventListener(ev, markActive, { capture: true }));
                    document.removeEventListener('visibilitychange', onVisible);
                    window.removeEventListener('online', beat);
                    window.removeEventListener('pagehide', goOffline);
                    window.removeEventListener('beforeunload', goOffline);
                    const tabs = readTabs(); delete tabs[tabId]; writeTabs(tabs);
                };
            }, [appUser && appUser.id, useLocalMode]);

            // Re-evaluate who is online even when no new data arrives
            useEffect(() => {
                const t = setInterval(() => setTick(n => n + 1), 5000);
                return () => clearInterval(t);
            }, []);

            const isOnlineNow = (u) => {
                const seen = presenceSeen.current[u.id];
                const last = seen !== undefined ? seen : presence[u.id];
                return !!(presence[u.id] && last && Date.now() - last < ONLINE_WINDOW_MS);
            };
            // only changes identity when somebody goes online / offline (avoids resetting local state every tick)
            const onlineKey = data.users ? data.users.map(u => isOnlineNow(u) ? '1' : '0').join('') : '';
            const usersWithPresence = useMemo(() => {
                if (!data.users) return data.users;
                return data.users.map(u => ({ ...u, isOnline: isOnlineNow(u) }));
            }, [data.users, onlineKey]);

            if (!data.users || !data.projects || !data.sections || !data.tasks) {
                return (
                    <div className="h-screen w-full flex flex-col items-center justify-center bg-gray-50 text-blue-600 gap-4">
                        <CheckCircle className="w-10 h-10 animate-bounce" />
                        <span className="font-bold tracking-wider uppercase text-sm">Connecting to Workspace...</span>
                    </div>
                );
            }

            const handleLogout = async () => {
                if (appUser && window.fb && window.fb.db && !useLocalMode) {
                    try {
                        await window.fb.setDoc(window.fb.doc(window.fb.db, 'artifacts', 'taskflow_pro_v1', 'public', 'data', 'presence', 'all'), { [appUser.id]: 0 }, { merge: true });
                    } catch(e) {}
                }
                sessionStorage.removeItem('tf_active_user');
                try { localStorage.removeItem('tf_remember'); } catch (e) {}  // signing out ends auto sign-in (username stays prefilled)
                setAppUser(null);
            };

            const handleLogin = async (matched, remember) => {
                try {
                    if (remember) {
                        localStorage.setItem('tf_remember', JSON.stringify({ id: matched.id }));
                        localStorage.setItem('tf_remember_name', matched.username);
                    } else {
                        localStorage.removeItem('tf_remember');
                        localStorage.removeItem('tf_remember_name');
                    }
                } catch (e) {}
                setAppUser({...matched, isOnline: true});
                sessionStorage.setItem('tf_active_user', JSON.stringify({...matched, isOnline: true}));
            }

            // keep Root's copy equal to what this browser just wrote (own echoes are skipped), so presence updates never roll back a fresh write
            const mirrorLocal = (col, items) => setData(prev => prev[col] === items ? prev : ({ ...prev, [col]: items }));

            if (!appUser) return <LoginScreen users={data.users} onLogin={handleLogin} />;

            // always use the live user record, so a role change by the admin applies immediately
            const liveUser = appUser ? { ...appUser, ...(usersWithPresence.find(u => u.id === appUser.id) || {}), isOnline: true } : appUser;
            return <App appUser={liveUser} setAppUser={setAppUser} globalData={{ ...data, users: usersWithPresence }} handleLogout={handleLogout} useLocalMode={useLocalMode} onLocalWrite={mirrorLocal} />;
        }

        ReactDOM.render(<Root />, document.getElementById('root'));
    </script>
</body>
</html>
